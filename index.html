<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小学远程学习平台 - 人教版同步</title>
<style>
/* ============================================
   小学远程学习平台 - 专业重构版 CSS
   设计系统：教育级配色 + 8px间距基准
   ============================================ */

/* --- CSS变量：设计系统 --- */
:root{
  /* 主色系 */
  --primary: #4F7DF9;
  --primary-dark: #3B5FE0;
  --primary-light: #E8F0FE;
  --secondary: #FF9F43;
  --secondary-light: #FFF3E0;
  --success: #2ED573;
  --success-light: #E8F8EF;
  --warning: #FFA502;
  --danger: #FF4757;
  --danger-light: #FFE8EA;
  
  /* 中性色 */
  --text-primary: #2C3E50;
  --text-secondary: #5F6C7B;
  --text-muted: #95A5A6;
  --bg-page: #F5F7FA;
  --bg-card: #FFFFFF;
  --bg-hover: #F8F9FA;
  --border: #E8ECF1;
  
  /* 字体 */
  --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 15px;
  --font-size-lg: 18px;
  --font-size-xl: 24px;
  --font-size-2xl: 32px;
  --font-size-3xl: 48px;
  
  /* 间距（8px基准） */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  
  /* 圆角 */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;
  
  /* 阴影 */
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
  --shadow-primary: 0 4px 20px rgba(79,125,249,0.25);
  
  /* 过渡 */
  --transition-fast: 0.15s ease;
  --transition-base: 0.3s ease;
  --transition-slow: 0.5s ease;
}

/* --- 基础重置 --- */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family: var(--font-family);
  background: var(--bg-page);
  color: var(--text-primary);
  font-size: var(--font-size-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea{font-family:inherit;outline:none}
a{text-decoration:none;color:inherit}

/* --- 应用容器 --- */
.app{
  max-width: 480px;
  margin: 0 auto;
  background: var(--bg-page);
  min-height: 100vh;
  position: relative;
  padding-bottom: 90px;
}

/* --- 顶部导航栏（新设计） --- */
.top-nav{
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0 var(--space-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  backdrop-filter: blur(10px);
}
.top-nav .nav-left{display:flex;align-items:center;gap:var(--space-sm)}
.top-nav .nav-title{font-size:var(--font-size-lg);font-weight:700;color:var(--text-primary)}
.top-nav .nav-right{display:flex;align-items:center;gap:var(--space-sm)}
.top-nav .nav-icon-btn{
  width: 40px;height: 40px;
  display: flex;align-items: center;justify-content: center;
  border-radius: var(--radius-full);
  font-size: 20px;
  transition: var(--transition-fast);
  position: relative;
}
.top-nav .nav-icon-btn:hover{background:var(--bg-hover)}
.top-nav .nav-badge{
  position: absolute;top:4px;right:4px;
  background: var(--danger);color: #fff;
  font-size: 10px;font-weight: 700;
  min-width: 16px;height: 16px;
  border-radius: var(--radius-full);
  display: flex;align-items: center;justify-content: center;
  padding: 0 4px;
}

/* --- 通用页面头部（renderHeader渲染） --- */
.header{
  padding: 20px 16px 16px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
}
.header .back-btn{
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--primary-light);
  color: var(--primary);
  padding: 8px 16px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-sm);
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition-fast);
  margin-bottom: 12px;
  margin-left: 4px;
}
.header .back-btn:hover{
  background: var(--primary);
  color: #fff;
}
.header h1{
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--text-primary);
  margin-left: 4px;
}
.header .sub{
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  margin-top: 4px;
  margin-left: 4px;
}

/* --- 页面头部（带返回按钮） --- */
.page-header{
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  padding: var(--space-lg) var(--space-md);
  position: relative;
}
.page-header .back-btn{
  display: inline-flex;align-items: center;gap: 4px;
  background: rgba(255,255,255,0.2);
  color: #fff;
  padding: 8px 16px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-sm);
  font-weight: 500;
  transition: var(--transition-fast);
  margin-bottom: var(--space-md);
  margin-left: 4px;
}
.page-header .back-btn:hover{background:rgba(255,255,255,0.3)}
.page-header h1{font-size:var(--font-size-xl);font-weight:700}
.page-header .sub{font-size:var(--font-size-sm);opacity:0.9;margin-top:4px}

/* --- 页面容器 --- */
.page{padding: var(--space-md)}

/* --- 面包屑 --- */
.breadcrumb{
  font-size: var(--font-size-xs);
  color: var(--text-muted);
  margin-bottom: var(--space-md);
  display: flex;align-items: center;flex-wrap: wrap;gap: 4px;
}
.breadcrumb span{cursor:pointer;transition:var(--transition-fast)}
.breadcrumb span:hover{color:var(--primary)}
.breadcrumb .sep{color:var(--text-muted);cursor:default}

/* --- 首页仪表盘 --- */
.dashboard-welcome{
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  border-radius: var(--radius-xl);
  padding: var(--space-lg);
  margin-bottom: var(--space-lg);
  position: relative;
  overflow: hidden;
}
.dashboard-welcome::before{
  content: '';
  position: absolute;
  top: -50%;right: -20%;
  width: 200px;height: 200px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
}
.dashboard-welcome .welcome-title{font-size:var(--font-size-lg);font-weight:600;margin-bottom:4px}
.dashboard-welcome .welcome-sub{font-size:var(--font-size-sm);opacity:0.9}
.dashboard-welcome .streak-badge{
  display: inline-flex;align-items: center;gap: 4px;
  background: rgba(255,255,255,0.2);
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  font-weight: 600;
  margin-top: var(--space-sm);
}

/* 今日任务 */
.today-tasks{
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  margin-bottom: var(--space-lg);
  box-shadow: var(--shadow-sm);
}
.section-title{
  font-size: var(--font-size-base);
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: var(--space-md);
  display: flex;align-items: center;gap: 8px;
}
.section-title .icon{font-size:20px}
.task-item{
  display: flex;align-items: center;gap: var(--space-md);
  padding: var(--space-sm) 0;
  border-bottom: 1px solid var(--border);
}
.task-item:last-child{border-bottom:none}
.task-checkbox{
  width: 24px;height: 24px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex;align-items: center;justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  transition: var(--transition-fast);
}
.task-checkbox.done{background:var(--success);border-color:var(--success);color:#fff}
.task-info{flex:1}
.task-name{font-size:var(--font-size-sm);font-weight:500;color:var(--text-primary)}
.task-meta{font-size:var(--font-size-xs);color:var(--text-muted);margin-top:2px}
.task-progress{
  width: 60px;height: 6px;
  background: var(--border);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.task-progress .fill{height:100%;background:var(--primary);border-radius:var(--radius-full);transition:var(--transition-base)}

/* 数据概览 */
.stats-grid{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-sm);
  margin-bottom: var(--space-lg);
}
.stat-card{
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: var(--transition-fast);
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card .stat-num{
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--primary);
  line-height: 1.2;
}
.stat-card .stat-label{
  font-size: var(--font-size-xs);
  color: var(--text-muted);
  margin-top: 4px;
}
.stat-card .stat-trend{
  font-size: 10px;
  font-weight: 600;
  margin-top: 2px;
}
.stat-card .stat-trend.up{color:var(--success)}
.stat-card .stat-trend.down{color:var(--danger)}

/* 快捷入口 */
.quick-actions{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-sm);
  margin-bottom: var(--space-lg);
}
.quick-action{
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: var(--space-md) var(--space-sm);
  text-align: center;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: var(--transition-fast);
  border: 2px solid transparent;
}
.quick-action:hover{
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--primary-light);
}
.quick-action .qa-icon{
  font-size: 28px;
  margin-bottom: 6px;
}
.quick-action .qa-name{
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text-primary);
}
.quick-action .qa-desc{
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* 年级选择 */
.grade-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-md);
}
.grade-card{
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: var(--space-lg) var(--space-sm);
  text-align: center;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: var(--transition-base);
  border: 2px solid transparent;
  position: relative;
}
.grade-card:hover{
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--primary);
}
.grade-card .grade-num{
  font-size: var(--font-size-2xl);
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.grade-card .grade-name{
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  margin-top: 4px;
  font-weight: 500;
}
.grade-card .grade-status{
  position: absolute;
  top: 8px;right: 8px;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-full);
}
.grade-card .grade-status.studying{background:var(--primary-light);color:var(--primary)}
.grade-card .grade-status.review{background:var(--secondary-light);color:var(--secondary)}
.grade-card.locked{opacity:0.5}
.grade-card.locked:hover{transform:none;box-shadow:var(--shadow-sm);border-color:transparent}
.grade-card .lock-icon{font-size:20px;margin-top:8px}

/* 册别选择 */
.term-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-md);
}
.term-card{
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: var(--space-xl) var(--space-md);
  text-align: center;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: var(--transition-base);
}
.term-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.term-card .term-icon{font-size:48px;margin-bottom:var(--space-sm)}
.term-card .term-name{font-size:var(--font-size-lg);font-weight:700;color:var(--text-primary)}
.term-card .term-desc{font-size:var(--font-size-xs);color:var(--text-muted);margin-top:6px}

/* 科目选择 */
.subject-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-md);
}
.subject-card{
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: var(--space-lg) var(--space-sm);
  text-align: center;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: var(--transition-base);
}
.subject-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.subject-card .sub-icon{font-size:40px;margin-bottom:8px}
.subject-card .sub-name{font-size:var(--font-size-base);font-weight:700;color:var(--text-primary)}
.subject-card .sub-count{font-size:var(--font-size-xs);color:var(--text-muted);margin-top:4px}

/* 单元列表 */
.unit-list{display:flex;flex-direction:column;gap:var(--space-sm)}
.unit-item{
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  cursor: pointer;
  transition: var(--transition-fast);
  border-left: 4px solid transparent;
}
.unit-item:hover{
  transform: translateX(4px);
  box-shadow: var(--shadow-md);
  border-left-color: var(--primary);
}
.unit-item .unit-num{
  width: 44px;height: 44px;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  display: flex;align-items: center;justify-content: center;
  font-size: var(--font-size-base);
  font-weight: 700;
  margin-right: var(--space-md);
  flex-shrink: 0;
}
.unit-item .unit-info{flex:1;min-width:0}
.unit-item .unit-name{
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.unit-item .unit-desc{font-size:var(--font-size-xs);color:var(--text-muted);margin-top:2px}
.unit-item .unit-progress{
  width: 80px;height: 6px;
  background: var(--border);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin-top: 6px;
}
.unit-item .unit-progress .fill{height:100%;background:var(--success);border-radius:var(--radius-full)}
.unit-item .unit-arrow{color:var(--text-muted);font-size:20px;margin-left:var(--space-sm)}

/* 考试入口 */
.action-row{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-sm);
  margin: var(--space-md) 0;
}
.action-btn{
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: var(--space-md) var(--space-sm);
  text-align: center;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: var(--transition-fast);
}
.action-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.action-btn .act-icon{font-size:28px;margin-bottom:6px}
.action-btn .act-name{font-size:var(--font-size-xs);font-weight:600;color:var(--text-primary)}
.action-btn .act-desc{font-size:10px;color:var(--text-muted);margin-top:2px}

/* 学习路径 */
.path-step{
  display: flex;align-items: center;gap: var(--space-md);
  padding: var(--space-md);
  background: var(--bg-card);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-sm);
  box-shadow: var(--shadow-sm);
  transition: var(--transition-fast);
  border-left: 4px solid var(--border);
}
.path-step.locked{opacity:0.6;background:var(--bg-hover)}
.path-step.completed{background:var(--success-light);border-left-color:var(--success)}
.path-step.active{background:var(--primary-light);border-left-color:var(--primary)}
.path-step .step-icon{
  font-size: 24px;
  width: 44px;height: 44px;
  display: flex;align-items: center;justify-content: center;
  background: var(--bg-hover);
  border-radius: var(--radius-full);
  flex-shrink: 0;
}
.path-step.completed .step-icon{background:var(--success);color:#fff}
.path-step.active .step-icon{background:var(--primary);color:#fff}
.path-step .step-info{flex:1}
.path-step .step-title{font-size:var(--font-size-sm);font-weight:600;color:var(--text-primary)}
.path-step .step-desc{font-size:var(--font-size-xs);color:var(--text-muted);margin-top:2px}
.path-step .step-status{font-size:var(--font-size-xs);font-weight:600;white-space:nowrap}
.path-step.completed .step-status{color:var(--success)}
.path-step.active .step-status{color:var(--primary)}
.path-step.locked .step-status{color:var(--text-muted)}

/* 知识点Tab */
.knowledge-tabs{
  display: flex;
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
  overflow-x: auto;
  padding-bottom: 4px;
}
.knowledge-tab{
  padding: 8px 16px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--text-secondary);
  background: var(--bg-card);
  cursor: pointer;
  transition: var(--transition-fast);
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
}
.knowledge-tab:hover{color:var(--primary)}
.knowledge-tab.active{
  background: var(--primary);
  color: #fff;
  box-shadow: var(--shadow-primary);
}

/* 知识点内容 */
.knowledge-section{
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  margin-bottom: var(--space-md);
  box-shadow: var(--shadow-sm);
}
.knowledge-section h3{
  font-size: var(--font-size-base);
  color: var(--primary);
  margin-bottom: var(--space-md);
  display: flex;align-items: center;gap: 8px;
  font-weight: 700;
}
.knowledge-section h3 .icon{font-size:20px}
.knowledge-section .content{font-size:var(--font-size-sm);line-height:1.8;color:var(--text-secondary)}
.knowledge-section .content p{margin-bottom:8px}
.knowledge-section .content .highlight{
  background: var(--secondary-light);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--secondary);
  font-weight: 600;
}
.knowledge-section .content .formula{
  background: var(--primary-light);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--primary);
  margin: 8px 0;
  font-family: 'Courier New', monospace;
  font-weight: 600;
  color: var(--primary-dark);
}

/* 互动演示 */
.demo-box{
  background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
  text-align: center;
}
.demo-box .demo-title{font-size:var(--font-size-base);font-weight:700;color:var(--primary);margin-bottom:var(--space-md)}
.demo-box .demo-formula{
  font-size: var(--font-size-2xl);
  font-weight: 800;
  color: var(--primary-dark);
  margin: var(--space-md) 0;
  font-family: 'Courier New', monospace;
}
.demo-box .demo-slider{width:100%;margin:var(--space-md) 0}
.demo-box .demo-slider input[type="range"]{
  width: 100%;
  height: 8px;
  border-radius: var(--radius-full);
  background: var(--border);
  outline: none;
  -webkit-appearance: none;
}
.demo-box .demo-slider input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance: none;
  width: 24px;height: 24px;
  border-radius: 50%;
  background: var(--primary);
  cursor: pointer;
  box-shadow: var(--shadow-primary);
}
.demo-box .demo-label{font-size:var(--font-size-sm);color:var(--text-secondary);margin-bottom:4px}
.demo-box .demo-value{font-size:var(--font-size-lg);font-weight:700;color:var(--primary)}
.demo-box .demo-explain{
  background: rgba(255,255,255,0.8);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  margin-top: var(--space-md);
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  text-align: left;
}

/* 练习/考试页面 */
.exam-header{
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  margin-bottom: var(--space-md);
  box-shadow: var(--shadow-sm);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.exam-header .progress{font-size:var(--font-size-sm);color:var(--text-secondary)}
.exam-header .timer{font-size:var(--font-size-sm);color:var(--danger);font-weight:700}
.progress-bar{
  height: 8px;
  background: var(--border);
  border-radius: var(--radius-full);
  margin-bottom: var(--space-md);
  overflow: hidden;
}
.progress-bar .fill{
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--primary-dark));
  border-radius: var(--radius-full);
  transition: width var(--transition-base);
}
.question-card{
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: var(--space-lg);
  margin-bottom: var(--space-md);
  box-shadow: var(--shadow-sm);
  min-height: 300px;
}
.question-card .q-meta{display:flex;gap:8px;margin-bottom:var(--space-md)}
.question-card .q-tag{
  font-size: var(--font-size-xs);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  color: #fff;
  font-weight: 600;
}
.q-tag.type-choice{background:var(--primary)}
.q-tag.type-fill{background:var(--success)}
.q-tag.type-calc{background:var(--warning)}
.q-tag.type-app{background:var(--secondary)}
.q-tag.diff-basic{background:var(--success)}
.q-tag.diff-medium{background:var(--warning)}
.q-tag.diff-hard{background:var(--danger)}
.question-card .q-text{
  font-size: var(--font-size-base);
  line-height: 1.8;
  color: var(--text-primary);
  margin-bottom: var(--space-md);
  font-weight: 500;
}
.question-card .q-image{
  background: var(--bg-hover);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  margin-bottom: var(--space-md);
  text-align: center;
  font-size: 48px;
}
.options-list{display:flex;flex-direction:column;gap:var(--space-sm)}
.option-item{
  padding: var(--space-md);
  background: var(--bg-hover);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition-fast);
  border: 2px solid transparent;
  font-size: var(--font-size-sm);
}
.option-item:hover{background:var(--primary-light);border-color:var(--primary)}
.option-item.selected{background:var(--primary-light);border-color:var(--primary);color:var(--primary);font-weight:600}
.option-item.correct{background:var(--success-light);border-color:var(--success);color:var(--success)}
.option-item.wrong{background:var(--danger-light);border-color:var(--danger);color:var(--danger)}
.fill-input{
  width: 100%;
  padding: var(--space-md);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  font-size: var(--font-size-base);
  transition: var(--transition-fast);
}
.fill-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}

/* 苏格拉底引导 */
.socrates-box{
  background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  margin-top: var(--space-md);
  border-left: 4px solid var(--warning);
}
.socrates-box .s-title{
  font-size: var(--font-size-sm);
  font-weight: 700;
  color: var(--warning);
  margin-bottom: var(--space-sm);
  display: flex;align-items: center;gap: 6px;
}
.socrates-box .s-question{
  font-size: var(--font-size-sm);
  color: var(--text-primary);
  margin-bottom: var(--space-sm);
  line-height: 1.6;
}
.socrates-box .s-options{display:flex;flex-wrap:wrap;gap:8px}
.socrates-box .s-option{
  padding: 6px 14px;
  background: #fff;
  border: 2px solid var(--border);
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  cursor: pointer;
  transition: var(--transition-fast);
}
.socrates-box .s-option:hover{border-color:var(--warning);color:var(--warning)}

/* 答案解析 */
.explain-box{
  background: var(--primary-light);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  margin-top: var(--space-md);
  border-left: 4px solid var(--primary);
  display: none;
}
.explain-box.show{display:block}
.explain-box .e-title{font-weight:700;color:var(--primary);margin-bottom:6px;font-size:var(--font-size-sm)}
.explain-box .e-content{font-size:var(--font-size-sm);line-height:1.7;color:var(--text-secondary)}

/* 按钮 */
.btn{
  display: block;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius-md);
  font-size: var(--font-size-base);
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition-fast);
  text-align: center;
}
.btn-primary{
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: var(--shadow-primary);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(79,125,249,0.35)}
.btn-primary:active{transform:translateY(0)}
.btn-outline{
  background: var(--bg-card);
  color: var(--primary);
  border: 2px solid var(--primary);
}
.btn-outline:hover{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-group{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-md);
  margin-top: var(--space-md);
}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}

/* 结果页面 */
.result-card{
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: var(--space-xl);
  text-align: center;
  box-shadow: var(--shadow-md);
  margin-top: var(--space-lg);
}
.result-card .score{
  font-size: var(--font-size-3xl);
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.result-card .score-label{font-size:var(--font-size-sm);color:var(--text-muted);margin-top:4px}
.result-card .level{
  display: inline-block;
  padding: 6px 20px;
  border-radius: var(--radius-full);
  font-size: var(--font-size-sm);
  font-weight: 700;
  margin-top: var(--space-md);
}
.level.excellent{background:var(--success-light);color:var(--success)}
.level.good{background:var(--primary-light);color:var(--primary)}
.level.pass{background:var(--secondary-light);color:var(--secondary)}
.level.fail{background:var(--danger-light);color:var(--danger)}
.result-stats{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-md);
  margin-top: var(--space-lg);
}
.result-stat{
  background: var(--bg-hover);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  text-align: center;
}
.result-stat .num{font-size:var(--font-size-xl);font-weight:700;color:var(--text-primary)}
.result-stat .label{font-size:var(--font-size-xs);color:var(--text-muted);margin-top:2px}

/* 错题本 */
.wrong-question-card{
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--space-sm);
  border-left: 4px solid var(--danger);
}
.wrong-question-card .wq-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wrong-question-card .wq-tag{font-size:10px;padding:2px 8px;border-radius:var(--radius-full);background:var(--danger-light);color:var(--danger);font-weight:600}
.wrong-question-card .wq-date{font-size:var(--font-size-xs);color:var(--text-muted)}
.wrong-question-card .wq-text{font-size:var(--font-size-sm);color:var(--text-primary);line-height:1.6;margin-bottom:8px}
.wrong-question-card .wq-answer{font-size:var(--font-size-xs);color:var(--success);font-weight:600}

/* 家长端 */
.parent-header{
  background: linear-gradient(135deg, #2C3E50 0%, #34495E 100%);
  color: #fff;
  border-radius: var(--radius-xl);
  padding: var(--space-lg);
  margin-bottom: var(--space-lg);
}
.parent-header .ph-title{font-size:var(--font-size-lg);font-weight:700;margin-bottom:4px}
.parent-header .ph-sub{font-size:var(--font-size-xs);opacity:0.8}
.parent-stats{
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-sm);
  margin-bottom: var(--space-lg);
}
.p-stat{
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: var(--transition-fast);
}
.p-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.p-stat .p-num{font-size:var(--font-size-xl);font-weight:700;color:var(--primary)}
.p-stat .p-label{font-size:var(--font-size-xs);color:var(--text-muted);margin-top:4px}

/* 图表容器 */
.chart-box{
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  margin-bottom: var(--space-lg);
  box-shadow: var(--shadow-sm);
}
.chart-box .chart-title{font-size:var(--font-size-base);font-weight:700;color:var(--text-primary);margin-bottom:var(--space-md)}
.chart-box .chart-content{height:200px;display:flex;align-items:flex-end;justify-content:space-around;gap:8px;padding:var(--space-md) 0}
.chart-box .chart-bar{
  flex: 1;
  background: linear-gradient(180deg, var(--primary), var(--primary-dark));
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  position: relative;
  transition: var(--transition-base);
  min-height: 20px;
}
.chart-box .chart-bar:hover{opacity:0.8}
.chart-box .chart-bar .bar-value{
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
}
.chart-box .chart-bar .bar-label{
  position: absolute;
  bottom: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
}

/* AI建议 */
.ai-suggestion{
  background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);
  border-radius: var(--radius-lg);
  padding: var(--space-md);
  margin-bottom: var(--space-lg);
  border-left: 4px solid var(--primary);
}
.ai-suggestion .ai-title{
  font-size: var(--font-size-base);
  font-weight: 700;
  color: var(--primary);
  margin-bottom: var(--space-sm);
  display: flex;align-items: center;gap: 8px;
}
.ai-suggestion .ai-content{font-size:var(--font-size-sm);line-height:1.8;color:var(--text-secondary)}
.ai-suggestion .ai-content p{margin-bottom:8px}

/* 薄弱知识点 */
.weak-item{
  display: flex;align-items: center;gap: var(--space-md);
  padding: var(--space-sm) 0;
  border-bottom: 1px solid var(--border);
}
.weak-item:last-child{border-bottom:none}
.weak-item .weak-rank{
  width: 24px;height: 24px;
  border-radius: 50%;
  background: var(--danger-light);
  color: var(--danger);
  display: flex;align-items: center;justify-content: center;
  font-size: var(--font-size-xs);
  font-weight: 700;
  flex-shrink: 0;
}
.weak-item .weak-info{flex:1}
.weak-item .weak-name{font-size:var(--font-size-sm);font-weight:600;color:var(--text-primary)}
.weak-item .weak-bar{
  width: 100px;height: 6px;
  background: var(--border);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin-top: 4px;
}
.weak-item .weak-bar .fill{height:100%;background:var(--danger);border-radius:var(--radius-full)}
.weak-item .weak-action{
  padding: 6px 12px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-full);
  font-size: var(--font-size-xs);
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition-fast);
}
.weak-item .weak-action:hover{background:var(--primary-dark)}

/* 底部导航栏 */
.tab-bar{
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--bg-card);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 12px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  z-index: 100;
  border-top: 1px solid var(--border);
}
.tab-item{
  text-align: center;
  padding: 6px 12px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: var(--font-size-xs);
  transition: var(--transition-fast);
  flex: 1;
  min-width: 0;
}
.tab-item.active{color:var(--primary)}
.tab-item .tab-icon{font-size:22px;margin-bottom:2px}
.tab-item:active{transform:scale(0.95)}

/* 英语版块 */
.english-tabs{
  display: flex;
  gap: var(--space-sm);
  margin-bottom: var(--space-lg);
}
.english-tab{
  flex: 1;
  padding: var(--space-md);
  background: var(--bg-card);
  border-radius: var(--radius-md);
  text-align: center;
  cursor: pointer;
  transition: var(--transition-fast);
  box-shadow: var(--shadow-sm);
  font-size: var(--font-size-sm);
  font-weight: 600;
  color: var(--text-secondary);
}
.english-tab.active{
  background: var(--primary);
  color: #fff;
  box-shadow: var(--shadow-primary);
}
.phonics-level{
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: var(--space-md);
  margin-bottom: var(--space-sm);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: var(--transition-fast);
  display: flex;
  align-items: center;
  gap: var(--space-md);
}
.phonics-level:hover{transform:translateX(4px);box-shadow:var(--shadow-md)}
.phonics-level .level-num{
  width: 40px;height: 40px;
  border-radius: var(--radius-full);
  background: var(--primary-light);
  color: var(--primary);
  display: flex;align-items: center;justify-content: center;
  font-weight: 700;
  font-size: var(--font-size-sm);
  flex-shrink: 0;
}
.phonics-level .level-info{flex:1}
.phonics-level .level-name{font-size:var(--font-size-sm);font-weight:600;color:var(--text-primary)}
.phonics-level .level-desc{font-size:var(--font-size-xs);color:var(--text-muted);margin-top:2px}

/* --- 响应式：平板（768px-1024px） --- */
@media (min-width: 768px){
  .app{max-width:768px;padding-bottom:0}
  .tab-bar{
    position: sticky;
    bottom: 0;
    max-width: 100%;
    transform: none;
    border-radius: 0;
  }
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .quick-actions{grid-template-columns:repeat(4,1fr)}
  .grade-grid{grid-template-columns:repeat(6,1fr);gap:var(--space-md)}
  .grade-card{padding:var(--space-xl) var(--space-md)}
  .grade-card .grade-num{font-size:var(--font-size-3xl)}
  .subject-grid{grid-template-columns:repeat(3,1fr)}
  .action-row{grid-template-columns:repeat(4,1fr)}
  .unit-list{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--space-sm);
  }
  .unit-item{margin-bottom:0}
  .parent-stats{grid-template-columns:repeat(4,1fr)}
  .result-stats{grid-template-columns:repeat(3,1fr)}
}

/* --- 响应式：PC大屏（1025px以上） --- */
@media (min-width: 1025px){
  body{
    background: var(--bg-page);
    min-height: 100vh;
    padding: 0;
  }
  .app{
    max-width: 100%;
    width: 100%;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
    min-height: 100vh;
    max-height: none;
    overflow-y: visible;
    background: var(--bg-page);
    padding-bottom: 100px;
  }
  
  /* 大屏顶部导航 */
  .top-nav{padding:0 40px;height:64px;max-width:1600px;margin:0 auto}
  .top-nav .nav-title{font-size:var(--font-size-xl)}
  
  /* 大屏页面头部 */
  .page-header{padding:40px 40px 40px 40px}
  .page-header h1{font-size:var(--font-size-2xl);margin-left:8px}
  .page-header .sub{margin-left:8px}
  .page-header .back-btn{padding:10px 20px;font-size:var(--font-size-base);margin-left:8px}
  /* 大屏通用页面头部 */
  .header{padding: 24px 40px 20px}
  .header .back-btn{padding: 10px 20px;font-size: var(--font-size-base);margin-left: 8px}
  .header h1{font-size: var(--font-size-2xl);margin-left: 8px}
  .header .sub{font-size: var(--font-size-base);margin-left: 8px}

  
  /* 大屏页面容器 */
  .page{padding:32px 40px;max-width:1600px;margin:0 auto}
  
  /* 大屏仪表盘 */
  .dashboard-welcome{padding:40px;margin-bottom:32px}
  .dashboard-welcome .welcome-title{font-size:28px}
  .dashboard-welcome .welcome-sub{font-size:16px}
  .dashboard-welcome .streak-badge{padding:8px 16px;font-size:14px}
  .stats-grid{grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:32px}
  .stat-card{padding:28px 20px}
  .stat-card .stat-num{font-size:36px}
  .stat-card .stat-label{font-size:14px}
  .quick-actions{grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:32px}
  .quick-action{padding:28px 20px}
  .quick-action .qa-icon{font-size:40px}
  .quick-action .qa-name{font-size:15px}
  .quick-action .qa-desc{font-size:12px}
  
  /* 大屏今日任务 */
  .today-tasks{padding:24px 28px;margin-bottom:32px}
  .task-item{padding:12px 0}
  .task-name{font-size:15px}
  .task-meta{font-size:13px}
  
  /* 大屏年级选择 - 充分利用宽度 */
  .grade-grid{grid-template-columns:repeat(6,1fr);gap:24px;max-width:100%}
  .grade-card{padding:48px 20px}
  .grade-card .grade-num{font-size:64px}
  .grade-card .grade-name{font-size:16px}
  
  /* 大屏册别选择 - 充分利用宽度 */
  .term-grid{grid-template-columns:repeat(2,1fr);gap:32px;max-width:100%}
  .term-card{padding:60px 40px}
  .term-card .term-icon{font-size:72px}
  .term-card .term-name{font-size:24px}
  .term-card .term-desc{font-size:14px}
  
  /* 大屏科目选择 - 充分利用宽度 */
  .subject-grid{grid-template-columns:repeat(3,1fr);gap:32px;max-width:100%}
  .subject-card{padding:48px 32px}
  .subject-card .sub-icon{font-size:64px}
  .subject-card .sub-name{font-size:20px}
  .subject-card .sub-count{font-size:14px}
  
  /* 大屏单元列表 - 双列更舒展 */
  .unit-list{grid-template-columns:repeat(2,1fr);gap:16px}
  .unit-item{padding:20px 24px}
  .unit-item .unit-num{width:52px;height:52px;font-size:18px}
  .unit-item .unit-name{font-size:16px}
  .unit-item .unit-desc{font-size:13px}
  
  /* 大屏考试入口 */
  .action-row{grid-template-columns:repeat(4,1fr);gap:20px;margin:24px 0}
  .action-btn{padding:28px 20px}
  .action-btn .act-icon{font-size:40px}
  .action-btn .act-name{font-size:15px}
  .action-btn .act-desc{font-size:12px}
  
  /* 大屏学习路径 */
  .path-step{padding:20px 24px;gap:20px}
  .path-step .step-icon{width:56px;height:56px;font-size:28px}
  .path-step .step-title{font-size:16px}
  .path-step .step-desc{font-size:13px}
  
  /* 大屏知识点 */
  .knowledge-section{padding:28px;margin-bottom:20px}
  .knowledge-section h3{font-size:18px}
  .knowledge-section .content{font-size:15px;line-height:2}
  .knowledge-tabs{gap:12px;margin-bottom:24px}
  .knowledge-tab{padding:12px 24px;font-size:15px}
  
  /* 大屏互动演示 */
  .demo-box{padding:40px}
  .demo-box .demo-title{font-size:18px}
  .demo-box .demo-formula{font-size:48px}
  .demo-box .demo-label{font-size:15px}
  .demo-box .demo-value{font-size:24px}
  .demo-box .demo-explain{padding:20px;font-size:14px}
  
  /* 大屏练习/考试 */
  .exam-header{padding:20px 24px;margin-bottom:20px}
  .exam-header .progress{font-size:15px}
  .exam-header .timer{font-size:15px}
  .question-card{padding:32px 36px;min-height:400px}
  .question-card .q-text{font-size:18px;line-height:2}
  .question-card .q-image{font-size:72px;padding:24px}
  .option-item{padding:18px 24px;font-size:16px}
  .fill-input{padding:18px 24px;font-size:18px}
  
  /* 大屏苏格拉底引导 */
  .socrates-box{padding:20px 24px}
  .socrates-box .s-title{font-size:15px}

<body>
<div class="app" id="app">
<!-- 页面将通过JS动态渲染 -->
</div>
<script>
// ============================================
// 平台状态管理
// ============================================
const STATE = {
  currentPage: 'grade', // grade, term, subject, unit, study, practice, exam, result, parent, english, phonics-level, ipa-detail
  lastStudy: null, // 上次学习位置
  selectedGrade: null,
  selectedTerm: null,
  selectedSubject: null,
  selectedUnit: null,
  englishTab: 'phonics', // phonics, ipa, pep
  englishParams: {},
  examState: null,
  userData: {
    name: '吕泳冀',
    grade: 6,
    streak: 3,
    totalMinutes: 45,
    totalQuestions: 2,
    wrongQuestions: [],
    examHistory: [],
    // 单元学习进度（学习路径锁+进度追踪）
    unitProgress: {},
    // 今日待复习错题
    reviewQueue: [],
    // 学习日期记录（用于连续打卡）
    studyDates: []
  }
};

// ============================================
// 学习路径锁 + 进度追踪 辅助函数
// ============================================
function getUnitKey(grade, term, subject, unitId) {
  return `${grade}-${term}-${subject}-${unitId}`;
}

function getUnitProgress(grade, term, subject, unitId) {
  const key = getUnitKey(grade, term, subject, unitId);
  if (!STATE.userData.unitProgress[key]) {
    STATE.userData.unitProgress[key] = {
      knowledgeRead: false,
      practiceTotal: 0,
      practiceCorrect: 0,
      practiceCompleted: false,
      examUnlocked: false,
      lastPracticeDate: null
    };
  }
  return STATE.userData.unitProgress[key];
}

function saveUnitProgress() {
  try {
    localStorage.setItem('edu_unit_progress', JSON.stringify(STATE.userData.unitProgress));
  } catch(e) {}
}

function loadUnitProgress() {
  try {
    const data = localStorage.getItem('edu_unit_progress');
    if (data) STATE.userData.unitProgress = JSON.parse(data);
  } catch(e) {}
}

// 检查解锁状态
function checkUnlock(grade, term, subject, unitId) {
  const p = getUnitProgress(grade, term, subject, unitId);
  const practiceAccuracy = p.practiceTotal > 0 ? p.practiceCorrect / p.practiceTotal : 0;
  return {
    practiceUnlocked: p.knowledgeRead,  // 学完知识点才能练习
    examUnlocked: practiceAccuracy >= 0.6 || p.examUnlocked  // 练习正确率≥60%才能考试
  };
}

// 标记知识点已读
function markKnowledgeRead(grade, term, subject, unitId) {
  const p = getUnitProgress(grade, term, subject, unitId);
  p.knowledgeRead = true;
  saveUnitProgress();
}

// 更新练习进度
function updatePracticeProgress(grade, term, subject, unitId, correct, total) {
  const p = getUnitProgress(grade, term, subject, unitId);
  p.practiceTotal += total;
  p.practiceCorrect += correct;
  p.practiceCompleted = true;
  p.lastPracticeDate = new Date().toISOString().split('T')[0];
  const accuracy = p.practiceTotal > 0 ? p.practiceCorrect / p.practiceTotal : 0;
  if (accuracy >= 0.6) p.examUnlocked = true;
  saveUnitProgress();
}

// 获取掌握度等级
function getMasteryLevel(grade, term, subject, unitId) {
  const p = getUnitProgress(grade, term, subject, unitId);
  if (p.practiceTotal === 0) return { level: '未学习', color: '#ccc', percent: 0 };
  const accuracy = p.practiceCorrect / p.practiceTotal;
  if (accuracy >= 0.9) return { level: '优秀', color: '#27ae60', percent: Math.round(accuracy * 100) };
  if (accuracy >= 0.75) return { level: '良好', color: '#3498db', percent: Math.round(accuracy * 100) };
  if (accuracy >= 0.6) return { level: '及格', color: '#f39c12', percent: Math.round(accuracy * 100) };
  return { level: '需努力', color: '#e74c3c', percent: Math.round(accuracy * 100) };
}

// ============================================
// 智能错题复习系统（间隔重复）
// ============================================
const REVIEW_INTERVALS = [1, 3, 7, 15, 30]; // 复习间隔（天）

function addWrongQuestion(question, grade, term, subject, unitId) {
  const wrongQ = {
    id: question.id || `wq_${Date.now()}_${Math.random().toString(36).substr(2,9)}`,
    question: question.q,
    type: question.type,
    opts: question.opts,
    ans: question.ans,
    explain: question.explain,
    diff: question.diff,
    grade, term, subject, unitId,
    addedDate: new Date().toISOString().split('T')[0],
    reviewCount: 0,
    correctStreak: 0,
    nextReviewDate: getNextReviewDate(0),
    mastered: false
  };
  
  // 避免重复添加
  const exists = STATE.userData.wrongQuestions.find(w => w.question === wrongQ.question);
  if (!exists) {
    STATE.userData.wrongQuestions.push(wrongQ);
    saveWrongQuestions();
  }
}

function getNextReviewDate(reviewCount) {
  const interval = REVIEW_INTERVALS[Math.min(reviewCount, REVIEW_INTERVALS.length - 1)];
  const date = new Date();
  date.setDate(date.getDate() + interval);
  return date.toISOString().split('T')[0];
}

function saveWrongQuestions() {
  try {
    localStorage.setItem('edu_wrong_questions', JSON.stringify(STATE.userData.wrongQuestions));
  } catch(e) {}
}

function loadWrongQuestions() {
  try {
    const data = localStorage.getItem('edu_wrong_questions');
    if (data) STATE.userData.wrongQuestions = JSON.parse(data);
  } catch(e) {}
}

function getTodayReviewQuestions() {
  const today = new Date().toISOString().split('T')[0];
  return STATE.userData.wrongQuestions.filter(w => !w.mastered && w.nextReviewDate <= today);
}

function getPendingReviewQuestions() {
  const today = new Date().toISOString().split('T')[0];
  return STATE.userData.wrongQuestions.filter(w => !w.mastered && w.nextReviewDate > today);
}

function getMasteredQuestions() {
  return STATE.userData.wrongQuestions.filter(w => w.mastered);
}

function updateWrongQuestionReview(id, isCorrect) {
  const q = STATE.userData.wrongQuestions.find(w => w.id === id);
  if (!q) return;
  
  if (isCorrect) {
    q.correctStreak++;
    q.reviewCount++;
    if (q.correctStreak >= 5) {
      q.mastered = true;
    } else {
      q.nextReviewDate = getNextReviewDate(q.reviewCount);
    }
  } else {
    q.correctStreak = 0;
    q.reviewCount = 0;
    q.nextReviewDate = getNextReviewDate(0); // 重新从1天后开始
  }
  saveWrongQuestions();
}

// ============================================
// 绘图函数库
// ============================================
function geoCircle(r=40,label=true){
  return `<svg width="120" height="120" viewBox="0 0 120 120" style="margin:8px 0"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#4A90D9" stroke-width="2"/><line x1="60" y1="60" x2="${60+r}" y2="60" stroke="#E74C3C" stroke-width="2"/><text x="${60+r/2}" y="55" font-size="11" fill="#E74C3C">r</text>${label?`<text x="55" y="65" font-size="10" fill="#666">O</text>`:''}</svg>`;
}
function geoRect(w=80,h=50){
  return `<svg width="140" height="90" viewBox="0 0 140 90" style="margin:8px 0"><rect x="20" y="20" width="${w}" height="${h}" fill="none" stroke="#4A90D9" stroke-width="2"/><text x="${20+w/2}" y="15" text-anchor="middle" font-size="11" fill="#666">长</text><text x="12" y="${20+h/2}" text-anchor="middle" font-size="11" fill="#666">宽</text></svg>`;
}
function geoRing(R=50,r=30){
  return `<svg width="140" height="140" viewBox="0 0 140 140" style="margin:8px 0"><circle cx="70" cy="70" r="${R}" fill="rgba(74,144,217,0.2)" stroke="#4A90D9" stroke-width="2"/><circle cx="70" cy="70" r="${r}" fill="#fff" stroke="#4A90D9" stroke-width="2"/><text x="70" y="75" text-anchor="middle" font-size="10" fill="#666">内圆</text></svg>`;
}
function geoSector(angle=90,r=40){
  const rad=(angle-90)*Math.PI/180;
  const x=70+r*Math.cos(rad), y=70+r*Math.sin(rad);
  const largeArc=angle>180?1:0;
  return `<svg width="140" height="140" viewBox="0 0 140 140" style="margin:8px 0"><path d="M70,70 L70,${70-r} A${r},${r} 0 ${largeArc},1 ${x},${y} Z" fill="rgba(118,75,162,0.3)" stroke="#764ba2" stroke-width="2"/><text x="70" y="85" text-anchor="middle" font-size="10" fill="#666">${angle}°</text></svg>`;
}
function geoLineDiagram(parts,totalLabel='单位"1"'){
  let segments='',x=0;
  parts.forEach((p,i)=>{
    const w=p.percent*2;
    segments+=`<rect x="${x}" y="20" width="${w}" height="30" fill="${p.color}" fill-opacity="0.3" stroke="${p.color}" stroke-width="2"/>`;
    if(p.label)segments+=`<text x="${x+w/2}" y="40" text-anchor="middle" font-size="10" fill="#333">${p.label}</text>`;
    x+=w;
  });
  return `<svg width="220" height="70" viewBox="0 0 220 70" style="margin:8px 0">${segments}<text x="100" y="15" text-anchor="middle" font-size="11" fill="#666">${totalLabel}</text></svg>`;
}
function geoDirection(angle=30){
  const rad=angle*Math.PI/180;
  const x2=100+60*Math.sin(rad), y2=100-60*Math.cos(rad);
  return `<svg width="200" height="200" viewBox="0 0 200 200" style="margin:8px 0"><circle cx="100" cy="100" r="70" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/><line x1="100" y1="30" x2="100" y2="170" stroke="#ccc" stroke-width="1"/><line x1="30" y1="100" x2="170" y2="100" stroke="#ccc" stroke-width="1"/><text x="100" y="25" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">北</text><text x="100" y="185" text-anchor="middle" font-size="12" fill="#333">南</text><text x="20" y="104" text-anchor="middle" font-size="12" fill="#333">西</text><text x="180" y="104" text-anchor="middle" font-size="12" fill="#333">东</text><circle cx="100" cy="100" r="4" fill="#E74C3C"/><line x1="100" y1="100" x2="${x2}" y2="${y2}" stroke="#E74C3C" stroke-width="2"/><text x="${x2+5}" y="${y2}" font-size="11" fill="#E74C3C">目标</text></svg>`;
}
function geoRatio(r1=3,r2=5,l1='甲',l2='乙'){
  const total=r1+r2, w1=r1/total*180, w2=r2/total*180;
  return `<svg width="220" height="80" viewBox="0 0 220 80" style="margin:8px 0"><rect x="10" y="20" width="${w1}" height="30" fill="#4A90D9" fill-opacity="0.4" stroke="#4A90D9" stroke-width="2"/><rect x="${10+w1}" y="20" width="${w2}" height="30" fill="#E74C3C" fill-opacity="0.4" stroke="#E74C3C" stroke-width="2"/><text x="${10+w1/2}" y="40" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">${l1} ${r1}份</text><text x="${10+w1+w2/2}" y="40" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">${l2} ${r2}份</text><text x="100" y="68" text-anchor="middle" font-size="11" fill="#666">${l1}:${l2} = ${r1}:${r2}</text></svg>`;
}
function geoPercent(part=60,total=100,label=''){
  const w=part/total*180;
  return `<svg width="220" height="60" viewBox="0 0 220 60" style="margin:8px 0"><rect x="10" y="15" width="180" height="25" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4"/><rect x="10" y="15" width="${w}" height="25" fill="#27AE60" rx="4"/><text x="${10+w/2}" y="32" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">${part}%</text><text x="100" y="55" text-anchor="middle" font-size="11" fill="#666">${label}</text></svg>`;
}
// 语文配图：古诗文意境卡
function geoPoemScene(title,scene,dynasty=''){
  return `<div style="margin:10px 0;padding:15px;background:linear-gradient(135deg,#fdfbfb 0%,#ebedee 100%);border-radius:12px;border-left:4px solid #764ba2"><div style="font-size:16px;font-weight:600;color:#764ba2;margin-bottom:6px">${title}${dynasty?` <span style="font-size:11px;color:#999;font-weight:normal">${dynasty}</span>`:''}</div><div style="font-size:28px;text-align:center;margin:8px 0">${scene}</div></div>`;
}
// 语文配图：阅读理解场景卡
function geoReadingScene(emoji,title){

}

// ============================================
// 交互动画演示组件
// ============================================

// 圆的面积互动演示
function demoCircleArea(demoId='circleArea'){

      <div class="demo-canvas">
        <svg id="${demoId}-svg" width="250" height="250" viewBox="0 0 250 250">
          <defs>
            <radialGradient id="${demoId}-grad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3" />
              <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.6" />
            </radialGradient>
          </defs>
          <circle cx="125" cy="125" r="80" fill="url(#${demoId}-grad)" stroke="#667eea" stroke-width="3" class="demo-animation"/>
          <line x1="125" y1="125" x2="205" y2="125" stroke="#E74C3C" stroke-width="3" stroke-dasharray="5,3"/>
          <text x="165" y="118" font-size="14" fill="#E74C3C" font-weight="bold">r</text>
          <text x="125" y="130" text-anchor="middle" font-size="12" fill="#666">圆心O</text>
        </svg>
      </div>
      <div class="demo-controls">
        <div class="demo-slider-group">
          <div class="demo-slider-label">
            <span>半径 r（厘米）</span>
            <span class="demo-value" id="${demoId}-rval">8</span>
          </div>
          <input type="range" class="demo-slider" min="2" max="12" value="8" 
            oninput="updateCircleArea('${demoId}', this.value)">
        </div>
        <div class="demo-result">
          <div class="result-label">圆的面积 S = πr²</div>
          <div class="result-value" id="${demoId}-result">200.96 cm²</div>
          <div class="result-formula" id="${demoId}-formula">S = 3.14 × 8² = 200.96</div>
        </div>
      </div>
      <div class="why-learn">
        <h4>🤔 为什么要学圆的面积？</h4>
        <p>圆是生活中最常见的图形之一！从钟表、车轮到餐盘、井盖，到处都有圆。学会计算圆的面积，我们就能知道做一个圆形餐桌需要多大的木板，一个圆形花坛能种多少花，甚至能算出披萨的大小够不够吃！</p>
      </div>
      <div class="real-life">
        <h4>🌍 生活中的应用</h4>
        <p>圆的面积在生活中无处不在：</p>
        <div class="examples">

function updateEquation(demoId, x){
  x = parseInt(x);
  document.getElementById(demoId+'-xval').textContent = x;
  const left = x + 5;
  const isBalanced = left === 12;
  document.getElementById(demoId+'-left').textContent = `${x}+5=${left}`;
  document.getElementById(demoId+'-result').textContent = `x = ${x}`;
  document.getElementById(demoId+'-formula').textContent = `${x} + 5 = ${left} ${isBalanced?'✓':'✗'}`;
  const beam = document.getElementById(demoId+'-beam');
  if(isBalanced){ beam.setAttribute('transform','rotate(0,125,80)'); }
  else if(left > 12){ beam.setAttribute('transform','rotate(-5,125,80)'); }
  else{ beam.setAttribute('transform','rotate(5,125,80)'); }
}

  for(let i=1; i<=n; i++){ if(n%i===0) factors.push(i); }

  document.getElementById(demoId+'-count').textContent = `共 ${factors.length} 个因数`;
  if(factors.length === 2){ document.getElementById(demoId+'-result').textContent = `质数（只有1和${n}两个因数）`; }
  else{ document.getElementById(demoId+'-result').textContent = `合数（有${factors.length}个因数）`; }
}

// 语文思维导图自动生成器
function generateMindmap(key){
  const parts = key.split('-');
  if(parts.length < 4) return null;
  const grade = parts[0];
  const term = parts[1];
  const unitId = parts[3];
  
  if(!CURRICULUM[grade] || !CURRICULUM[grade][term] || !CURRICULUM[grade][term].chinese) return null;
  const unit = CURRICULUM[grade][term].chinese.units.find(u=>u.id===unitId);
  if(!unit) return null;
  
  const topics = unit.topics || unit.name;
  const writing = unit.writing || '看图写话';
  
  // 根据单元内容生成课文列表
  const textList = topics.split(/[、，,]/).filter(t=>t.trim().length>0).slice(0,4);
  
  return {
    theme: unit.name + ' 知识导图',
    branches: [

function renderMindmap(key){
  let data = MINDMAP_DATA[key];
  // 如果没有找到思维导图，自动生成
  if(!data){
    data = generateMindmap(key);
  }
  if(!data) return '';
  
  let branchesHtml = '';
  data.branches.forEach(branch => {
    let nodesHtml = '';
    if(branch.nodes){
      nodesHtml = branch.nodes.map(node => `
        <div class="mindmap-node" style="border-left-color:${branch.color}">
          <div class="node-title">
            ${node.tag?`<span class="node-tag" style="background:${branch.color}">${node.tag}</span>`:''}
            ${node.title}
          </div>
          ${node.author?`<div class="node-author">${node.author}</div>`:''}
          <div class="node-desc">${node.desc}</div>
        </div>
      `).join('');
    }
    
    let keyPointsHtml = '';
    if(branch.keyPoints){
      keyPointsHtml = `<div class="mindmap-key-points">
        <h4>📌 核心要点</h4>
        <ul>${branch.keyPoints.map(p => `<li>${p}</li>`).join('')}</ul>
      </div>`;
    }
    
    let writingHtml = '';
    if(branch.writing){
      writingHtml = `<div class="mindmap-writing">
        <h4>✍️ ${branch.writing.topic}</h4>
        <p>${branch.writing.desc}</p>
        ${branch.writing.tips?`<div style="margin-top:10px">${branch.writing.tips.map(t => `<span class="writing-topic">💡 ${t}</span>`).join(' ')}</div>`:''}
      </div>`;
    }
    
    branchesHtml += `
      <div class="mindmap-branch" style="border-top-color:${branch.color};color:${branch.color}">
        <div class="branch-title" style="color:${branch.color}">
          <span class="branch-icon">${branch.icon}</span>
          ${branch.title}
        </div>
        ${nodesHtml}
        ${keyPointsHtml}
        ${writingHtml}
      </div>
    `;
  });
  
  return `<div class="mindmap-container">
    <div class="mindmap-center">${data.theme}</div>
    <div class="mindmap-branches">${branchesHtml}</div>
  </div>`;
}

// ============================================
// 题目生成器（根据知识点自动生成题目）
// ============================================
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function gcd(a,b){return b===0?a:gcd(b,a%b);}
function simplifyFraction(n,d){const g=gcd(Math.abs(n),Math.abs(d));return n/g+'/'+d/g;}

// 生成数学题目（按单元和题型）
function generateMathQuestions(grade,term,unitId,count=100){
  const questions=[];
  const types=['choice','fill','calc','app'];
  const diffs=['basic','basic','basic','basic','basic','basic','medium','medium','medium','hard'];
  
  // 题目模板库（按单元）
  const templates=getMathTemplates(grade,term,unitId);
  
  for(let i=0;i<count;i++){
    const t=randChoice(templates);
    const q=t();
    q.id=`${unitId}_${String(i+1).padStart(2,'0')}`;
    q.diff=diffs[i%diffs.length];
    questions.push(q);
  }
  return questions;
}

    templates.push(()=>({type:'app',q:'小明把自己这学期的数学测验成绩记录如下：第一次85分，第二次88分，第三次92分，第四次90分，第五次95分，第六次98分。请你说一说，如果要表示小明这学期数学成绩的变化情况，应选用什么统计图？为什么？从小明的成绩变化中你能得到什么信息？',ans:'应选用折线统计图。因为折线统计图不仅能表示出每次成绩的多少，而且能清楚地表示出成绩的增减变化情况。从小明的成绩变化中可以看出，小明的数学成绩总体呈上升趋势，说明小明这学期数学学习进步很大',explain:'要表示小明这学期数学成绩的变化情况，应选用折线统计图。因为折线统计图的特点是：不仅能表示出数量的多少，而且能清楚地表示出数量的增减变化情况。通过折线统计图，可以直观地看到小明这学期数学成绩的变化趋势。从成绩数据来看，小明的成绩从85分逐步提高到98分，总体呈上升趋势，说明小明这学期数学学习进步很大。'}));
  }
  
  // ========== 五年级下册 第八单元：数学广角——找次品 ==========
  if(key==='5-down-math-m8'){
    templates.push(()=>({type:'choice',q:'有3瓶钙片，其中1瓶少了3片，用天平称，至少称几次能保证找出这瓶次品？',opts:['1次','2次','3次','4次'],ans:0,explain:'把3瓶钙片分成3份，每份1瓶。在天平两端各放1瓶，如果天平平衡，剩下的那瓶就是次品；如果天平不平衡，轻的那端就是次品。所以至少称1次能保证找出次品。'}));
    templates.push(()=>({type:'choice',q:'有9个零件，其中1个是次品（次品重一些），用天平称，至少称几次能保证找出次品？',opts:['2次','3次','4次','5次'],ans:0,explain:'把9个零件平均分成3份，每份3个。第一次称：在天平两端各放3个，如果天平平衡，次品在剩下的3个中；如果天平不平衡，次品在重的那3个中。第二次称：把有次品的3个，在天平两端各放1个，如果平衡，剩下的是次品；如果不平衡，重的是次品。所以至少称2次。'}));
    templates.push(()=>({type:'choice',q:'找次品时，把物品分成几份称，才能保证称的次数最少？',opts:['3份','2份','4份','5份'],ans:0,explain:'找次品的最优策略：把待测物品分成3份，每份数量尽量平均，不能平均分的，也应该使多的一份与少的一份只相差1。这样才能保证称的次数最少。'}));
    templates.push(()=>({type:'fill',q:'用天平找次品时，所测物品数目与测试的次数有以下关系：2-3个物品，称____次；4-9个物品，称____次；10-27个物品，称____次',ans:'1 2 3',explain:'用天平找次品时，所测物品数目与测试的次数的关系：2-3个物品，称1次；4-9个物品，称2次；10-27个物品，称3次；28-81个物品，称4次。规律是：3^n < 物品数 ≤ 3^(n+1)，需要称n+1次。'}));
    templates.push(()=>({type:'fill',q:'有5瓶维生素，其中1瓶少了4片，用天平称，至少称____次能保证找出这瓶次品',ans:'2',explain:'把5瓶维生素分成3份（2,2,1）。第一次称：在天平两端各放2瓶，如果天平平衡，剩下的那瓶就是次品；如果天平不平衡，次品在轻的那2瓶中。第二次称：把有次品的2瓶，在天平两端各放1瓶，轻的那端就是次品。所以至少称2次。'}));
    templates.push(()=>{const n=randInt(10,20);return{type:'app',q:`有${n}盒饼干，其中1盒少了几块（次品轻一些），用天平称，至少称几次能保证找出这盒次品？`,ans:'3次',explain:`找次品的最优策略是把物品分成3份，每份尽量平均。${n}盒饼干，3^2=9<${n}≤27=3^3，所以至少需要称3次。具体方法：第一次把${n}盒分成3份，每份尽量平均，找出次品在哪一份中；第二次把有次品的一份再分成3份，继续找；第三次就能找出次品。`};});
    // 扩充题目
    templates.push(()=>({type:'choice',q:'有4袋糖果，其中1袋质量不足（轻一些），用天平称，至少称几次能保证找出这袋次品？',opts:['2次','1次','3次','4次'],ans:0,explain:'把4袋糖果分成3份（1,1,2）。第一次称：在天平两端各放1袋，如果天平不平衡，轻的那端就是次品；如果天平平衡，次品在剩下的2袋中。第二次称：把剩下的2袋，在天平两端各放1袋，轻的那端就是次品。所以至少称2次能保证找出次品。'}));
    templates.push(()=>({type:'choice',q:'有10个乒乓球，其中1个是次品（次品重一些），用天平称，至少称几次能保证找出次品？',opts:['3次','2次','4次','5次'],ans:0,explain:'把10个乒乓球分成3份（3,3,4）。第一次称：在天平两端各放3个，如果天平平衡，次品在剩下的4个中；如果天平不平衡，次品在重的那3个中。如果次品在3个中，第二次称就能找出；如果次品在4个中，把4个分成（1,1,2），第二次称找出次品在哪2个中，第三次称找出次品。所以至少称3次能保证找出次品。'}));
    templates.push(()=>({type:'choice',q:'有27个零件，其中1个是次品（次品轻一些），用天平称，至少称几次能保证找出次品？',opts:['3次','2次','4次','5次'],ans:0,explain:'把27个零件平均分成3份，每份9个。第一次称：找出次品在哪9个中。第二次称：把有次品的9个平均分成3份，每份3个，找出次品在哪3个中。第三次称：把有次品的3个，在天平两端各放1个，找出次品。所以至少称3次能保证找出次品。验证：3^3=27，所以27个物品需要称3次。'}));
    templates.push(()=>({type:'fill',q:'有8个外观相同的球，其中1个是次品（次品重一些），用天平称，至少称____次能保证找出次品',ans:'2',explain:'把8个球分成3份（3,3,2）。第一次称：在天平两端各放3个，如果天平平衡，次品在剩下的2个中；如果天平不平衡，次品在重的那3个中。如果次品在2个中，第二次称就能找出；如果次品在3个中，第二次称也能找出。所以至少称2次能保证找出次品。'}));
    templates.push(()=>({type:'fill',q:'用天平找次品时，如果只含1个次品（已知次品比正品重或轻），那么称n次最多能从____个物品中找出次品',ans:'3ⁿ',explain:'用天平找次品时，称1次最多能从3个物品中找出次品，称2次最多能从9=3²个物品中找出次品，称3次最多能从27=3³个物品中找出次品，以此类推，称n次最多能从3ⁿ个物品中找出次品。'}));
    templates.push(()=>({type:'app',q:'有15盒饼干，其中14盒质量相同，另有1盒少了几块（次品轻一些）。如果用天平称，至少称几次能保证找出这盒饼干？请写出你的思考过程。',ans:'至少称3次能保证找出这盒饼干。思考过程：把15盒饼干分成3份（5,5,5）。第一次称：在天平两端各放5盒，如果天平平衡，次品在剩下的5盒中；如果天平不平衡，次品在轻的那5盒中。第二次称：把有次品的5盒分成3份（2,2,1），在天平两端各放2盒，如果天平平衡，剩下的那盒就是次品；如果天平不平衡，次品在轻的那2盒中。第三次称：把有次品的2盒，在天平两端各放1盒，轻的那端就是次品。所以至少称3次能保证找出这盒饼干。',explain:'找次品的最优策略是把物品分成3份，每份数量尽量平均。15盒饼干，3^2=9<15≤27=3^3，所以至少需要称3次。具体方法：第一次把15盒分成（5,5,5），找出次品在哪5盒中；第二次把有次品的5盒分成（2,2,1），找出次品在哪2盒中或直接找出；第三次把有次品的2盒分成（1,1），找出次品。所以至少称3次能保证找出这盒饼干。'}));
  }
  
  // 如果没有特定模板，使用通用模板
  if(templates.length===0){
    templates.push(()=>({type:'choice',q:'下列计算正确的是？',opts:['A','B','C','D'],ans:0,explain:'根据运算法则逐一验证。'}));
    templates.push(()=>{const a=randInt(10,99),b=randInt(10,99);return{type:'fill',q:`${a} + ${b} = ____`,ans:`${a+b}`,explain:'相同数位对齐，从个位加起。'};});
    templates.push(()=>{const a=randInt(10,99),b=randInt(2,9);return{type:'calc',q:`计算：${a} × ${b}`,ans:`${a*b}`,explain:'从个位乘起，用一位数依次乘多位数每一位上的数。'};});
    templates.push(()=>{const a=randInt(20,100),b=randInt(10,50);return{type:'app',q:`商店运来${a}千克苹果，卖出${b}千克，还剩多少千克？`,ans:`${a-b}`,explain:'剩下的=总数-卖出的。'};});
  }
  
  // ========== 五年级上册 第八单元：总复习 ==========
  if(key==='5-up-math-m8'){
    templates.push(()=>{const a=randInt(2,9),b=randInt(11,99);return{type:'choice',q:`${a}.${b%10} × ${a} = ?`,opts:[`${a*a}.${(b%10)*a}`,`${a*a}.${b%10}`,`${a}.${(b%10)*a}`,`${a*a}.${(b%10)*a%10}`],ans:0,explain:'小数乘整数，先按整数乘法算，再点小数点。'};});
    templates.push(()=>{const x=randInt(2,9);return{type:'fill',q:`方程 3x + ${x*2} = ${x*5} 的解是 x = ____`,ans:`${x}`,explain:'3x = '+ (x*5-x*2) +'，x = '+ x +'。'};});
    templates.push(()=>{const r=randInt(3,8);return{type:'calc',q:`一个平行四边形底是${r*2}cm，高是${r}cm，面积是多少？`,ans:`${r*r*2}cm²`,explain:'平行四边形面积=底×高='+ (r*2) +'×'+ r +'='+ (r*r*2) +'cm²。'};});
    templates.push(()=>{const n=randInt(10,30);return{type:'app',q:`在一条长${n*10}米的小路一边植树，每隔5米栽一棵（两端都栽），一共要栽多少棵？`,ans:`${n*2+1}`,explain:'间隔数='+ (n*10) +'÷5='+ (n*2) +'，两端都栽棵数=间隔数+1='+ (n*2+1) +'。'};});
    templates.push(()=>{const a=randInt(2,9),b=randInt(2,9);return{type:'choice',q:`${a}.${b} ÷ 0.${b} = ?`,opts:[`${(a*10+b)/b}`,`${a}.${b}`,`${a+b}`,`${(a+b)*10}`],ans:0,explain:'除数是小数，先把除数化成整数，被除数同步移动小数点。'};});
  }
  
  // ========== 六年级下册 第六单元：整理和复习 ==========
  if(key==='6-down-math-m6'){
    templates.push(()=>{const a=randInt(2,9),b=randInt(2,9);return{type:'choice',q:`${a}/${b} + ${b}/${a} = ?`,opts:[`${(a*a+b*b)}/${a*b}`,`${a+b}/${a*b}`,`${a*b}/${a+b}`,`${(a+b)}/${a+b}`],ans:0,explain:'异分母分数相加，先通分，再按同分母分数加法计算。'};});
    templates.push(()=>{const r=randInt(3,8);return{type:'fill',q:`一个圆柱底面半径${r}cm，高${r*2}cm，体积是____cm³`,ans:`${Math.round(r*r*r*2*3.14)}`,explain:'圆柱体积=底面积×高=πr²h=3.14×'+ r +'²×'+ (r*2) +'='+ Math.round(r*r*r*2*3.14) +'cm³。'};});
    templates.push(()=>{const n=randInt(20,100);return{type:'calc',q:`一件商品原价${n}元，打八折出售，现价是多少元？`,ans:`${n*0.8}`,explain:'八折=80%，现价=原价×折扣='+ n +'×80%='+ (n*0.8) +'元。'};});
    templates.push(()=>{const a=randInt(2,5),b=randInt(3,8);return{type:'app',q:`在比例尺1:${a*1000}的地图上，量得两地距离${b}cm，实际距离是多少米？`,ans:`${b*a*10}`,explain:'实际距离=图上距离÷比例尺='+ b +'÷(1/'+ (a*1000) +')='+ (b*a*1000) +'cm='+ (b*a*10) +'m。'};});
    templates.push(()=>{const n=randInt(5,20);return{type:'choice',q:`把${n}个苹果放进3个抽屉，至少有一个抽屉放几个？`,opts:[`${Math.ceil(n/3)}`,`${n}`,`${Math.floor(n/3)}`,`${n-3}`],ans:0,explain:'鸽巢原理：'+ n +'÷3='+ Math.floor(n/3) +'余'+ (n%3) +'，至少有一个抽屉放'+ Math.ceil(n/3) +'个。'};});
  }
  
  return templates;
}

// 生成语文题目
function generateChineseQuestions(grade,term,unitId,count=100){
  const questions=[];
  const diffs=['basic','basic','basic','basic','basic','basic','medium','medium','medium','hard'];
  
  const templates=getChineseTemplates(grade,term,unitId);
  
  for(let i=0;i<count;i++){
    const t=randChoice(templates);
    const q=t();
    q.id=`${unitId}_${String(i+1).padStart(2,'0')}`;
    q.diff=diffs[i%diffs.length];
    questions.push(q);
  }
  return questions;
}

function getChineseTemplates(grade,term,unitId){
  const templates=[];
  const key=`${grade}-${term}-chinese-${unitId}`;
  
  // ========== 通用语文题目（所有单元通用）==========
  // 字词基础
  templates.push(()=>({type:'choice',q:'下列词语中加点字读音完全正确的一项是？',opts:['A. 渲染(xuàn) 勾勒(lè)','B. 渲染(xuān) 勾勒(lēi)','C. 渲染(xuǎn) 勾勒(léi)','D. 渲染(xuán) 勾勒(lěi)'],ans:0,explain:'"渲染"的"渲"读第四声xuàn，"勾勒"的"勒"读lè。注意多音字的读音区别。'}));
  templates.push(()=>({type:'choice',q:'下列词语中没有错别字的一项是？',opts:['绿毯 柔美 渲染','酒脱 迂回 疾驰','礼貌 拘速 羞涩','摔跤 天崖 奇丽'],ans:0,explain:'B项"酒脱"应为"洒脱"；C项"拘速"应为"拘束"；D项"天崖"应为"天涯"。A项全部正确。'}));
  templates.push(()=>({type:'choice',q:'"一碧千里"中"碧"的意思是？',opts:['青绿色','蓝色','玉石','碧绿'],ans:0,explain:'"一碧千里"形容很大的范围内都是碧绿的颜色。"碧"指青绿色。这个词常用来形容草原或田野的广阔翠绿。'}));
  templates.push(()=>({type:'choice',q:'"翠色欲流"中"欲"的意思是？',opts:['将要','想要','欲望','需要'],ans:0,explain:'"翠色欲流"形容翠绿的颜色好像要流淌出来一样。"欲"是"将要"的意思，不是"想要"。类似的词还有"含苞欲放""摇摇欲坠"。'}));
  templates.push(()=>({type:'fill',q:'"洒脱"的近义词是____，反义词是____',ans:'潇洒 拘束',explain:'"洒脱"形容言谈举止自然、不拘束。近义词有潇洒、自然、大方；反义词有拘束、拘谨、呆板。'}));
  templates.push(()=>({type:'fill',q:'给加点字注音：迂回( ) 羞涩( )',ans:'yū sè',explain:'"迂回"的"迂"读yū（第一声），指曲折环绕。"羞涩"的"涩"读sè（第四声），指难为情，态度不自然。'}));
  
  // 课文理解
  templates.push(()=>({type:'choice',q:'对课文《草原》内容理解不正确的一项是？',opts:['课文描写了草原的美丽风光','课文表现了蒙汉两族人民的深情厚谊','课文按事情发展顺序记叙','课文主要写了作者的一次旅行经历'],ans:3,explain:'《草原》按照事情发展顺序，描写了草原的美丽风光和蒙汉两族人民的深情厚谊，表达了作者对草原的热爱和对民族团结的赞美。不是简单写旅行经历。'+geoReadingScene('🌿','草原风光')}));
  templates.push(()=>({type:'choice',q:'《丁香结》中"丁香结"象征着什么？',opts:['生活中解不开的愁怨','美丽的花朵','春天的到来','快乐的生活'],ans:0,explain:'《丁香结》中，作者由丁香花联想到丁香结，象征着生活中解不开的愁怨。作者认为生活需要有"结"，这样的人生才有滋味。'}));
  templates.push(()=>({type:'fill',q:'《草原》的作者是____，原名____，代表作有《____》《____》等',ans:'老舍 舒庆春 骆驼祥子 茶馆',explain:'《草原》的作者是老舍，原名舒庆春，字舍予，北京人，满族。代表作有小说《骆驼祥子》《四世同堂》，话剧《茶馆》《龙须沟》等。'}));
  
  // 句段运用

    templates.push(()=>({type:'fill',q:'默写《寒食》：春城无处不飞花，____。日暮汉宫传蜡烛，____。',ans:'寒食东风御柳斜 轻烟散入五侯家',explain:'《寒食》是唐代韩翃的作品，描写了寒食节长安城的景象。"春城无处不飞花，寒食东风御柳斜。日暮汉宫传蜡烛，轻烟散入五侯家。"'+geoPoemScene('寒食','🌸🏯','唐·韩翃')}));
    templates.push(()=>({type:'fill',q:'默写《迢迢牵牛星》：迢迢牵牛星，____。纤纤擢素手，____。',ans:'皎皎河汉女 札札弄机杼',explain:'《迢迢牵牛星》是《古诗十九首》中的一首，描写了牛郎织女的传说故事，表达了相思离别之苦。"迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。"'+geoPoemScene('迢迢牵牛星','⭐🌌','古诗十九首')}));
    templates.push(()=>({type:'fill',q:'默写《十五夜望月》：中庭地白树栖鸦，____。今夜月明人尽望，____。',ans:'冷露无声湿桂花 不知秋思落谁家',explain:'《十五夜望月》是唐代王建的作品，描写了中秋月夜的景色，表达了思乡之情。"中庭地白树栖鸦，冷露无声湿桂花。今夜月明人尽望，不知秋思落谁家。"'+geoPoemScene('十五夜望月','🌙🏮','唐·王建')}));
    templates.push(()=>({type:'choice',q:'《北京的春节》的作者是？',opts:['老舍','鲁迅','巴金','茅盾'],ans:0,explain:'《北京的春节》的作者是老舍，原名舒庆春。课文按照时间顺序，描写了北京春节的民风民俗，表现了春节的隆重与热闹，表达了对传统文化的认同和喜爱。'}));
    templates.push(()=>({type:'choice',q:'《北京的春节》是按照什么顺序记叙的？',opts:['时间顺序','空间顺序','事情发展顺序','逻辑顺序'],ans:0,explain:'《北京的春节》按照时间顺序，从腊八到正月十九，依次描写了北京春节的各个阶段：腊八、小年、除夕、初一、初六、元宵节、正月十九，表现了春节的隆重与热闹。'}));
    templates.push(()=>({type:'fill',q:'《腊八粥》的作者是____，课文围绕____写了____、____、____等场景',ans:'沈从文 腊八粥 等粥 分粥 喝粥',explain:'《腊八粥》的作者是沈从文，课文围绕腊八粥，写了等粥、分粥、喝粥等场景，表现了八儿对腊八粥的渴望与喜爱，以及家庭生活的温馨甜蜜。'}));
  }
  
  // ========== 六年级下册 第二单元：为人民服务、十六年前的回忆、金色的鱼钩 ==========
  if(key==='6-down-chinese-c2'){
    templates.push(()=>({type:'choice',q:'《为人民服务》的作者是？',opts:['毛泽东','鲁迅','老舍','巴金'],ans:0,explain:'《为人民服务》是毛泽东主席于1944年9月8日在张思德同志追悼会上的演讲。文章围绕"为人民服务"这个中心，从树立正确的生死观、正确对待批评、搞好团结三个方面进行了论述。'}));
    templates.push(()=>({type:'choice',q:'《为人民服务》是一篇什么文体？',opts:['议论文','记叙文','说明文','散文'],ans:0,explain:'《为人民服务》是一篇议论文，围绕"为人民服务"这个中心论点，从三个方面进行了论述：1.树立正确的生死观；2.正确对待批评；3.搞好团结。文章论点鲜明，论据充分，逻辑严密。'}));
    templates.push(()=>({type:'fill',q:'《十六年前的回忆》的作者是____，文章采用了____的手法，前后照应，突出了作者对父亲的____之情',ans:'李星华 倒叙 怀念与崇敬',explain:'《十六年前的回忆》的作者是李星华（李大钊的女儿），文章采用倒叙手法，回忆了父亲李大钊被捕前、被捕时、被审时、被害后的情形，前后照应，突出了作者对父亲的怀念与崇敬之情。'}));
    templates.push(()=>({type:'fill',q:'《金色的鱼钩》叙述了红军长征途中，一位____接受任务，照顾三个生病的小战士过草地，最后牺牲的故事，表现了他____的崇高品质',ans:'炊事班长 忠于革命、舍己为人',explain:'《金色的鱼钩》叙述了红军长征途中，一位炊事班长接受党组织交给的任务，照顾三个生病的小战士过草地，最后牺牲的故事。"金色的鱼钩"象征着老班长忠于革命、舍己为人的崇高品质。'}));
    templates.push(()=>({type:'app',q:'阅读《为人民服务》片段，回答问题："人固有一死，或重于泰山，或轻于鸿毛。"这句话是什么意思？作者引用这句话的目的是什么？',ans:'意思是人总是要死的，但死的意义有不同，有的比泰山还重，有的比鸿毛还轻。目的是论证"为人民利益而死，就比泰山还重"的观点，树立正确的生死观',explain:'这句话出自司马迁的《报任安书》，意思是人总是要死的，但死的意义有不同。作者引用这句话，是为了论证"为人民利益而死，就比泰山还重；替法西斯卖力，替剥削人民和压迫人民的人去死，就比鸿毛还轻"的观点，树立正确的生死观。'}));
  }
  
  // ========== 六年级下册 第三单元：匆匆、那个星期天 ==========
  if(key==='6-down-chinese-c3'){
    templates.push(()=>({type:'choice',q:'《匆匆》的作者是？',opts:['朱自清','鲁迅','老舍','巴金'],ans:0,explain:'《匆匆》的作者是朱自清，字佩弦，现代著名散文家、诗人、学者。文章紧扣"匆匆"二字，细腻地刻画了时间流逝的踪迹，表达了作者对时光流逝的无奈和惋惜，揭示了既然来到这个世界就不能白白走一遭的主题思想。'}));
    templates.push(()=>({type:'fill',q:'《匆匆》中"燕子去了，有再来的时候；____，____；桃花谢了，有再开的时候。但是，聪明的，你告诉我，____？"',ans:'杨柳枯了 有再青的时候 我们的日子为什么一去不复返呢',explain:'这是《匆匆》开头的排比句，用燕子再来、杨柳再青、桃花再开，反衬时间一去不复返，表达了作者对时光流逝的无奈和惋惜。'}));
    templates.push(()=>({type:'choice',q:'《那个星期天》的作者是？',opts:['史铁生','朱自清','鲁迅','老舍'],ans:0,explain:'《那个星期天》的作者是史铁生。文章记叙了母亲答应带"我"出去玩，但由于家务繁忙而一次次爽约的事，表现了"我"从期待到失望委屈的心理过程，也表现了母亲从早到晚操劳家务的辛劳。'}));
    templates.push(()=>({type:'fill',q:'《那个星期天》中"我"的心理变化过程是：____→____→____→____',ans:'期待 兴奋 焦急 失望委屈',explain:'《那个星期天》中"我"的心理变化过程：早晨充满期待→上午兴奋等待→下午焦急无奈→最后失望委屈。文章通过心理描写、动作描写、环境描写，细腻地表现了"我"的心理变化过程。'}));
    templates.push(()=>({type:'app',q:'《匆匆》中"像针尖上一滴水滴在大海里，我的日子滴在时间的流里，没有声音，也没有影子。"这句话运用了什么修辞手法？有什么作用？',ans:'运用了比喻的修辞手法，把"我的日子"比作"针尖上一滴水"，把"时间的流"比作"大海"，生动形象地写出了日子的渺小和时间流逝的快速，表达了作者对时光流逝的无奈和惋惜',explain:'这句话运用了比喻的修辞手法，本体是"我的日子"和"时间的流"，喻体是"针尖上一滴水"和"大海"。针尖上的水滴入大海，悄无声息，无影无踪，生动形象地写出了日子的渺小和时间流逝的快速、无声无息，表达了作者对时光流逝的无奈和惋惜。'}));
  }
  
  // ========== 六年级下册 第四单元：古诗三首、为人民服务、金色的鱼钩 ==========
  if(key==='6-down-chinese-c4'){
    templates.push(()=>({type:'fill',q:'默写《马诗》：大漠沙如雪，____。何当金络脑，____。',ans:'燕山月似钩 快走踏清秋',explain:'《马诗》是唐代李贺的作品，通过咏马表现了诗人渴望建功立业而又不被赏识的感慨。"大漠沙如雪，燕山月似钩。何当金络脑，快走踏清秋。"'+geoPoemScene('马诗','🐴🏜️','唐·李贺')}));
    templates.push(()=>({type:'fill',q:'默写《石灰吟》：千锤万凿出深山，____。粉骨碎身浑不怕，____。',ans:'烈火焚烧若等闲 要留清白在人间',explain:'《石灰吟》是明代于谦的作品，通过咏石灰表现了诗人不畏艰险、不怕牺牲、忠诚卓绝的意志和情操。"千锤万凿出深山，烈火焚烧若等闲。粉骨碎身浑不怕，要留清白在人间。"'+geoPoemScene('石灰吟','🪨🔥','明·于谦')}));
    templates.push(()=>({type:'fill',q:'默写《竹石》：咬定青山不放松，____。千磨万击还坚劲，____。',ans:'立根原在破岩中 任尔东西南北风',explain:'《竹石》是清代郑燮（郑板桥）的作品，通过咏竹表现了诗人坚韧顽强、不畏艰险、刚正不阿的品格。"咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。"'+geoPoemScene('竹石','🎋💪','清·郑燮')}));
    templates.push(()=>({type:'choice',q:'《石灰吟》运用了什么写作手法？',opts:['托物言志','借景抒情','动静结合','虚实结合'],ans:0,explain:'《石灰吟》运用了托物言志的写作手法，通过对石灰的吟咏，表现了诗人不畏艰险、不怕牺牲、忠诚卓绝的意志和情操。石灰的"千锤万凿""烈火焚烧""粉骨碎身"象征着诗人经历的磨难，"要留清白在人间"象征着诗人的高尚品格。'}));
    templates.push(()=>({type:'choice',q:'《竹石》中"任尔东西南北风"表现了竹子怎样的品格？',opts:['坚韧顽强、不畏艰险','随风摇摆、没有主见','骄傲自大、目中无人','孤芳自赏、不合群'],ans:0,explain:'"任尔东西南北风"意思是任凭你刮东西南北风，竹子都不会动摇。这句话表现了竹子坚韧顽强、不畏艰险、刚正不阿的品格，也是诗人自身品格的写照。'}));
  }
  
  // ========== 六年级下册 第五单元：文言文二则、表里的生物、真理诞生于一百个问号之后 ==========
  if(key==='6-down-chinese-c5'){
    templates.push(()=>({type:'fill',q:'《学弈》中"弈秋，通国之善弈者也。使弈秋诲二人弈，其一人____，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，____。"',ans:'专心致志 思援弓缴而射之',explain:'《学弈》选自《孟子·告子上》，通过弈秋教两个人学下棋的故事，说明了学习必须专心致志，不可三心二意的道理。"其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之。"'}));
    templates.push(()=>({type:'choice',q:'《两小儿辩日》中两个小孩争论的是什么问题？',opts:['太阳什么时候离人近','太阳什么时候大','太阳什么时候热','太阳什么时候亮'],ans:0,explain:'《两小儿辩日》选自《列子·汤问》，讲述了两个小孩争论太阳什么时候离人近的问题，一个小孩认为早晨太阳离人近，另一个小孩认为中午太阳离人近，孔子不能判断谁对谁错。故事说明了知识无穷、学无止境的道理，也表现了孔子实事求是的态度。'}));
    templates.push(()=>({type:'choice',q:'《真理诞生于一百个问号之后》的中心论点是？',opts:['真理诞生于一百个问号之后','科学发现需要善于观察、不断探索','只要善于观察就能发现真理','科学发现很容易'],ans:0,explain:'《真理诞生于一百个问号之后》的中心论点是"真理诞生于一百个问号之后"。文章通过洗澡水的漩涡、紫罗兰的变色、睡觉时眼珠的转动三个事例，论证了只要善于观察、不断发问、不断解决疑问、锲而不舍地追根求源，就能在现实生活中发现真理。'}));
    templates.push(()=>({type:'fill',q:'《表里的生物》中"我"是一个____、____的孩子',ans:'好奇心强 善于观察思考',explain:'《表里的生物》中"我"是一个好奇心强、善于观察思考的孩子。"我"认为凡是能发出声音的都是活的生物，所以对父亲的表极为好奇，并相信了父亲说的表里有一个小蝎子的话，表现了"我"的天真可爱和强烈的好奇心。'}));
    templates.push(()=>({type:'app',q:'《学弈》告诉我们什么道理？请结合生活实际谈谈你的理解。',ans:'告诉我们学习必须专心致志，不可三心二意的道理。在学习中，只有专心致志、全神贯注，才能学好知识；如果三心二意、心不在焉，就会一事无成',explain:'《学弈》通过弈秋教两个人学下棋的故事，说明了学习必须专心致志，不可三心二意的道理。两个人同时学下棋，一个人专心致志，另一个人三心二意，结果学习效果截然不同。在我们的学习和生活中，也是如此：只有专心致志、全神贯注，才能学好知识、做好事情；如果三心二意、心不在焉，就会一事无成。'}));
  }
  
  // ========== 六年级下册 第六单元：综合性学习：难忘小学生活 ==========
  if(key==='6-down-chinese-c6'){
    templates.push(()=>({type:'choice',q:'写临别赠言时，应该注意什么？',opts:['内容要健康，情感要真挚，语言要得体','随便写什么都行','只写好听的话','越长越好'],ans:0,explain:'写临别赠言时，应该注意：1.内容要健康向上；2.情感要真挚，表达真情实感；3.语言要得体，符合赠言对象的身份和特点；4.可以引用名言警句，也可以自己创作。赠言不在于长短，而在于真诚。'}));
    templates.push(()=>({type:'fill',q:'综合性学习的活动形式可以有：____、____、____、____等',ans:'举办演讲比赛 编班史 写临别赠言 举办毕业联欢会',explain:'综合性学习"难忘小学生活"的活动形式可以有：举办演讲比赛、编班史、写临别赠言、举办毕业联欢会、制作成长纪念册、给老师写感谢信等。通过这些活动，回忆小学生活，表达对老师、同学、母校的感激和留恋之情。'}));
    templates.push(()=>({type:'app',q:'请给你的老师写一段临别赠言（不少于30字）',ans:'（开放题，合理即可）示例：敬爱的老师，感谢您六年来对我的辛勤教导和悉心关怀。您的教诲如春风化雨，滋润着我的心田。在即将毕业之际，衷心祝愿您工作顺利，身体健康，桃李满天下！',explain:'临别赠言要注意：1.内容健康向上；2.情感真挚，表达对老师的感激和祝福；3.语言得体，符合学生身份；4.可以引用名言警句，也可以自己创作。示例：敬爱的老师，感谢您六年来对我的辛勤教导和悉心关怀...'}));
    templates.push(()=>({type:'app',q:'请给你的同学写一段临别赠言（不少于30字）',ans:'（开放题，合理即可）示例：亲爱的同学，六年的小学生活转瞬即逝，我们一起学习、一起玩耍、一起成长。在即将分别之际，愿我们的友谊地久天长，祝你在新的学习环境中取得更大的进步！',explain:'给同学的临别赠言要注意：1.内容健康向上；2.情感真挚，表达对同学的友谊和祝福；3.语言得体，符合同学身份；4.可以回忆共同的经历，也可以表达美好的祝愿。示例：亲爱的同学，六年的小学生活转瞬即逝...'}));
  }
  
  // ========== 六年级下册 第七、八单元：总复习、小升初衔接 ==========

    templates.push(()=>({type:'fill',q:'人物描写的方法有：____描写、____描写、____描写、____描写等',ans:'外貌 语言 动作 心理',explain:'人物描写的方法有：外貌描写（描写人物的容貌、衣着、体型等）、语言描写（描写人物的对话、独白等）、动作描写（描写人物的动作、行为等）、心理描写（描写人物的思想活动、内心感受等）。通过这些描写方法，可以把人物写得生动形象、栩栩如生。'}));

function generateSocrates(question){
  const steps=[];
  if(question.type==='choice'){
    if(question.explain && question.explain.includes('面积')){
      steps.push({q:'这道题要求的是什么？是周长还是面积？',hint:'看题目最后的问题，"面积是多少"还是"周长是多少"'});
      steps.push({q:'求面积需要知道什么条件？',hint:'圆的面积公式是S=πr²，需要知道半径r'});
      steps.push({q:'题目给的是半径还是直径？如果是直径怎么求半径？',hint:'直径d=2r，所以半径r=d÷2'});
      steps.push({q:'现在代入公式计算一下，结果是多少？',hint:'S=πr²，先算r²，再乘3.14'});
    }else if(question.explain && question.explain.includes('分数')){
      steps.push({q:'这道题的单位"1"是什么？是已知还是未知？',hint:'"的"字前面的量通常是单位"1"'});
      steps.push({q:'单位"1"已知用什么法？未知用什么法？',hint:'单位"1"已知用乘法，未知用除法或方程'});
      steps.push({q:'对应分率是多少？怎么列式？',hint:'对应量=单位"1"×对应分率'});
      steps.push({q:'计算一下结果，注意约分哦！',hint:'分数乘法能约分的先约分再计算'});
    }else{
      steps.push({q:'这道题考查的是什么知识点？',hint:'回想一下这个单元学了哪些内容'});
      steps.push({q:'题目给了哪些已知条件？要求什么？',hint:'把已知条件和问题圈出来'});
      steps.push({q:'应该用什么方法或公式来解决？',hint:'回忆一下相关的公式和解题方法'});
      steps.push({q:'代入计算一下，结果是多少？',hint:'仔细计算，注意单位和格式'});
    }
  }
  return steps;
}

  switch(STATE.currentPage){

function renderUnitPage(){
  const grade=STATE.selectedGrade;
  const term=STATE.selectedTerm==='up'?'上册':'下册';
  const subject=STATE.selectedSubject==='chinese'?'语文':'数学';
  const curriculum=CURRICULUM[grade][STATE.selectedTerm][STATE.selectedSubject];
  
  // 计算整体进度
  let totalUnits = curriculum.units.length;
  let completedUnits = 0;
  let totalQuestions = 0;
  let totalCorrect = 0;
  curriculum.units.forEach(u=>{
    const p = getUnitProgress(grade, STATE.selectedTerm, STATE.selectedSubject, u.id);
    if (p.practiceCompleted) completedUnits++;
    totalQuestions += p.practiceTotal;
    totalCorrect += p.practiceCorrect;
  });
  const overallAccuracy = totalQuestions > 0 ? Math.round(totalCorrect / totalQuestions * 100) : 0;
  const overallProgress = Math.round(completedUnits / totalUnits * 100);
  
  let items='';
  curriculum.units.forEach((u,i)=>{
    const p = getUnitProgress(grade, STATE.selectedTerm, STATE.selectedSubject, u.id);
    const unlock = checkUnlock(grade, STATE.selectedTerm, STATE.selectedSubject, u.id);
    const mastery = getMasteryLevel(grade, STATE.selectedTerm, STATE.selectedSubject, u.id);
    const accuracy = p.practiceTotal > 0 ? Math.round(p.practiceCorrect / p.practiceTotal * 100) : 0;
    
    items+=`<div class="unit-item" data-unit="${u.id}" style="position:relative">
      <div class="unit-num">${i+1}</div>
      <div class="unit-info" style="flex:1">
        <div class="unit-name">${u.name}：${u.topics}</div>
        ${u.writing?`<div class="unit-desc">习作：${u.writing}</div>`:''}
        <div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:100px;height:6px;background:#eee;border-radius:3px;overflow:hidden">
            <div style="width:${mastery.percent}%;height:100%;background:${mastery.color};border-radius:3px;transition:width 0.3s"></div>
          </div>
          <span style="font-size:11px;color:${mastery.color};font-weight:600;white-space:nowrap">${mastery.level} ${p.practiceTotal>0?accuracy+'%':''}</span>
          ${p.knowledgeRead?'<span style="font-size:10px;color:#27ae60;background:#d4edda;padding:2px 6px;border-radius:8px">📖已学</span>':''}
          ${unlock.examUnlocked?'<span style="font-size:10px;color:#3498db;background:#d6eaf8;padding:2px 6px;border-radius:8px">📝可考试</span>':''}
        </div>
      </div>
      <div class="unit-arrow">›</div>
    </div>`;
  });
  
  return renderHeader(`${grade}年级${term}${subject}`, '选择单元', true)+
    `<div class="page">
      <div class="breadcrumb"><span onclick="navigate('grade')">首页</span><span class="sep">›</span><span onclick="navigate('term')">${grade}年级</span><span class="sep">›</span><span onclick="navigate('subject')">${term}</span><span class="sep">›</span><span>${subject}</span></div>
      
      <!-- 整体进度卡片 -->
      <div class="progress-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <span style="font-size:15px;font-weight:600;color:#333">📊 本册学习进度</span>
          <span style="font-size:13px;color:#667eea;font-weight:600">${completedUnits}/${totalUnits} 单元 · 正确率 ${overallAccuracy}%</span>
        </div>
        <div style="height:10px;background:#eee;border-radius:5px;overflow:hidden">
          <div style="width:${overallProgress}%;height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:5px;transition:width 0.5s"></div>
        </div>
        <div style="font-size:12px;color:#999;margin-top:8px">💡 学习路径：先看知识点总结 → 做单元练习 → 参加考试</div>
      </div>
      
      <!-- 考试模块 -->
      <div style="font-size:14px;font-weight:600;color:#333;margin:20px 0 10px">📋 考试中心</div>
      <div class="action-row">
        <div class="action-btn" onclick="showUnitExamModal()">
          <div class="act-icon">📝</div>
          <div class="act-name">单元考试</div>
          <div style="font-size:10px;color:#999;margin-top:4px">选择单元</div>
        </div>

          <div class="act-icon">📊</div>
          <div class="act-name">月考试</div>
          <div style="font-size:10px;color:#999;margin-top:4px">阶段综合</div>
        </div>

function startExamWithCheck(type){
  if (!STATE.selectedUnit && type === 'unit') {
    alert('请先选择一个单元！');
    return;
  }
  if (type === 'unit') {
    const unlock = checkUnlock(STATE.selectedGrade, STATE.selectedTerm, STATE.selectedSubject, STATE.selectedUnit);
    if (!unlock.examUnlocked) {
      const p = getUnitProgress(STATE.selectedGrade, STATE.selectedTerm, STATE.selectedSubject, STATE.selectedUnit);
      const accuracy = p.practiceTotal > 0 ? Math.round(p.practiceCorrect / p.practiceTotal * 100) : 0;
      alert(`🔒 考试未解锁\n\n当前正确率：${accuracy}%\n需要：先学习知识点，再做练习，正确率达到60%以上解锁考试\n\n💡 建议：先点击下方单元，学习知识点并做练习`);
      return;
    }
  }
  startExam(type);
}
