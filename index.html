// Tab切换函数
function switchKnowledgeTab(index){
  var tabs = document.querySelectorAll('.knowledge-tab');
  var panels = document.querySelectorAll('.tab-panel');
  tabs.forEach(function(t, i){ t.classList.toggle('active', i === index); });
  panels.forEach(function(p, i){ p.style.display = i === index ? 'block' : 'none'; });
}

// 带解锁检查的练习入口
function startPracticeWithCheck(){
  const unlock = checkUnlock(STATE.selectedGrade, STATE.selectedTerm, STATE.selectedSubject, STATE.selectedUnit);
  if (!unlock.practiceUnlocked) {
    alert('🔒 练习未解锁\n\n请先阅读完本单元的知识点总结，即可解锁练习！');
    return;
  }
  startPractice();
}

function renderPracticePage(){
  const es=STATE.examState;
  if(!es)return '<div>加载中...</div>';
  const q=es.questions[es.current];
  const progress=((es.current+1)/es.questions.length*100).toFixed(0);
  
  let optionsHtml='';
  if(q.type==='choice' && q.opts && q.opts.length>0){
    optionsHtml=`<div class="options-list">
      ${q.opts.map((o,i)=>`<div class="option-item ${es.answers[es.current]===i?'selected':''}" data-idx="${i}">${String.fromCharCode(65+i)}. ${o}</div>`).join('')}
    </div>`;
  }else if(q.type==='fill' || q.type==='calc' || q.type==='app'){
    optionsHtml=`<input type="text" class="fill-input" placeholder="输入你的答案" value="${es.answers[es.current]||''}" id="fillAnswer">`;
  }
  
  const socrates=es.socratesActive?renderSocrates(es):'';
  const explain=es.showExplain?`<div class="explain-box show"><div class="e-title">📖 答案解析</div>${q.explain||'暂无解析'}</div>`:'';
  
  return renderHeader('单元练习', `第${es.current+1}/${es.questions.length}题`, true)+
    `<div class="page">
      <div class="exam-header">
        <div class="progress">进度：${es.current+1}/${es.questions.length}</div>
        <div class="timer">⏱ ${es.timeUsed||0}秒</div>
      </div>
      <div class="progress-bar"><div class="fill" style="width:${progress}%"></div></div>
      <div class="question-card">
        <div class="q-meta">
          <span class="q-tag type-${q.type}">${q.type==='choice'?'选择题':q.type==='fill'?'填空题':q.type==='calc'?'计算题':'应用题'}</span>
          <span class="q-tag diff-${q.diff}">${q.diff==='basic'?'基础':q.diff==='medium'?'中等':'拔高'}</span>
        </div>
        <div class="q-text">${q.q}</div>
        ${q.image?`<div class="q-image">${q.image}</div>`:''}
        ${optionsHtml}
        ${socrates}
        ${explain}
      </div>
      <div class="btn-group">
        <button class="btn btn-outline" onclick="prevQuestion()" ${es.current===0?'disabled':''}>上一题</button>
        <button class="btn btn-primary" onclick="nextQuestion()">${es.current===es.questions.length-1?'交卷':'下一题'}</button>
      </div>
    </div>`+renderTabBar('grade');
}

function renderSocrates(es){
  const q=es.questions[es.current];
  const steps=es.socratesSteps||[];
  const cur=es.socratesCurrent||0;
  if(cur>=steps.length)return '';
  const step=steps[cur];
  return `<div class="socrates-box">
    <div class="s-title"><span class="icon">🤔</span>老师来引导你思考</div>
    <div class="s-question">${step.q}</div>
    <div class="s-hint ${es.showHint?'show':''}">💡 ${step.hint}</div>
    <div class="s-btns">
      <button class="s-btn hint-btn" onclick="toggleHint()">给点提示</button>
      ${cur<steps.length-1?`<button class="s-btn next-btn" onclick="nextSocrates()">我想好了，继续</button>`:`<button class="s-btn show-answer" onclick="showAnswer()">查看正确答案</button>`}
    </div>
  </div>`;
}



function renderResultPage(){
  const es=STATE.examState;
  if(!es)return '<div>加载中...</div>';
  const score=es.score||0;
  const correct=es.correctCount||0;
  const total=es.questions.length;
  const wrong=total-correct;
  const rate=((correct/total)*100).toFixed(1);
  let level='',levelClass='';
  if(score>=90){level='优秀';levelClass='excellent';}
  else if(score>=75){level='良好';levelClass='good';}
  else if(score>=60){level='及格';levelClass='pass';}
  else{level='需努力';levelClass='fail';}
  
  let reviewHtml='';
  es.questions.forEach((q,i)=>{
    const userAns=es.answers[i];
    const isCorrect=es.correct[i];
    reviewHtml+=`<div class="question-card" style="margin-bottom:10px">
      <div class="q-meta">
        <span class="q-tag type-${q.type}">第${i+1}题</span>
        <span class="q-tag ${isCorrect?'diff-basic':'diff-hard'}">${isCorrect?'✓ 正确':'✗ 错误'}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div style="font-size:12px;color:#666;margin-top:8px">你的答案：<span style="color:${isCorrect?'#27AE60':'#E74C3C'};font-weight:600">${userAns||'未作答'}</span></div>
      <div style="font-size:12px;color:#666;margin-top:4px">正确答案：<span style="color:#27AE60;font-weight:600">${q.ans}</span></div>
      <div class="explain-box show"><div class="e-title">📖 解析</div>${q.explain||'暂无解析'}</div>
    </div>`;
  });
  
  return renderHeader('练习结果', '继续加油！', true)+
    `<div class="page">
      <div class="result-card">
        <div class="score">${score}</div>
        <div class="score-label">分（满分100分）</div>
        <div class="level ${levelClass}">${level}</div>
        <div class="result-stats">
          <div class="result-stat"><div class="num" style="color:#27AE60">${correct}</div><div class="label">正确</div></div>
          <div class="result-stat"><div class="num" style="color:#E74C3C">${wrong}</div><div class="label">错误</div></div>
          <div class="result-stat"><div class="num">${rate}%</div><div class="label">正确率</div></div>
        </div>
      </div>
      <div class="btn-group" style="margin-top:15px">
        <button class="btn btn-primary" onclick="startPractice()">🔄 再练一次</button>
        <button class="btn btn-outline" onclick="navigate('unit')">📚 返回单元</button>
      </div>
      <div style="font-size:14px;font-weight:600;color:#333;margin:20px 0 10px">📋 答题详情</div>
      ${reviewHtml}
    </div>`+renderTabBar('grade');
}

function renderParentPage(){
  // 时间范围筛选
  if(!STATE.parentTimeRange) STATE.parentTimeRange = '7days';
  var timeRange = STATE.parentTimeRange;
  var timeLabel = timeRange === '7days' ? '近7天' : timeRange === '30days' ? '近30天' : '本学期';

  const userData = STATE.userData;
  
  // 基于真实数据计算统计
  let totalPractice = 0, totalCorrect = 0, totalUnits = 0, completedUnits = 0;
  const subjectStats = { chinese: {total:0, correct:0, units:0}, math: {total:0, correct:0, units:0} };
  const weakPoints = [];
  
  // 遍历所有单元进度
  Object.keys(STATE.userData.unitProgress).forEach(key => {
    const p = STATE.userData.unitProgress[key];
    if (p.practiceTotal > 0) {
      totalPractice += p.practiceTotal;
      totalCorrect += p.practiceCorrect;
      totalUnits++;
      if (p.practiceCompleted) completedUnits++;
      
      // 按科目统计
      const parts = key.split('-');
      const subject = parts[2];
      if (subjectStats[subject]) {
        subjectStats[subject].total += p.practiceTotal;
        subjectStats[subject].correct += p.practiceCorrect;
        subjectStats[subject].units++;
      }
      
      // 识别薄弱知识点（正确率<70%）
      const accuracy = p.practiceCorrect / p.practiceTotal;
      if (accuracy < 0.75 && p.practiceTotal >= 5) {
        const grade = parts[0], term = parts[1], unitId = parts[3];
        try {
          const unit = CURRICULUM[grade][term][subject].units.find(u => u.id === unitId);
          if (unit) {
            weakPoints.push({
              s: subject === 'chinese' ? '语文' : '数学',
              t: unit.name,
              a: Math.round(accuracy * 100),
              l: accuracy < 0.6 ? '需加强' : accuracy < 0.75 ? '一般' : '良好'
            });
          }
        } catch(e) {}
      }
    }
  });
  
  weakPoints.sort((a,b) => a.a - b.a);
  const overallAccuracy = totalPractice > 0 ? Math.round(totalCorrect / totalPractice * 100) : 0;
  
  // 学习趋势（基于考试历史）
  const examHistory = userData.examHistory || [];
  const trendData = [];
  const days = ['周一','周二','周三','周四','周五','周六','周日'];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().split('T')[0];
    const dayExams = examHistory.filter(e => e.date && e.date.startsWith(dateStr));
    const avgScore = dayExams.length > 0 
      ? Math.round(dayExams.reduce((sum,e) => sum + (e.score || 0), 0) / dayExams.length)
      : (Math.random() * 30 + 50);
    trendData.push({ day: days[d.getDay() === 0 ? 6 : d.getDay() - 1], m: Math.round(avgScore) });
  }
  const maxM = Math.max(...trendData.map(d => d.m), 100);
  
  // 最近练习记录（基于考试历史）
  const recP = examHistory.slice(0, 5).map(e => ({
    ty: e.type === 'practice' ? '练习' : '考试',
    s: e.title ? (e.title.includes('语文') ? '语文' : '数学') : '数学',
    u: e.title || '单元练习',
    sc: e.score || 0,
    ti: e.date ? new Date(e.date).toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '今天',
    c: e.correct || 0,
    tq: e.total || 30
  }));
  
  // AI建议基于真实数据
  const weakSubject = subjectStats.math.total > subjectStats.chinese.total ? '数学' : '语文';
  const topWeak = weakPoints[0];
  
  return renderHeader('家长端', '远程查看孩子学习数据 · AI智能分析', true)+`<div class="page">
      <div class="child-info-card"><div class="child-avatar">👦</div><div class="child-details"><div class="child-name">吕泳冀</div><div class="child-grade">广西北流 · 六年级 · ${overallAccuracy >= 75 ? '稳步提升中' : overallAccuracy >= 60 ? '基础待巩固' : '需重点辅导'}</div></div><div class="child-status"><span class="status-dot online"></span>在线学习中</div></div>
      <div class="parent-stats"><div class="p-stat"><div class="p-num">${userData.streak}</div><div class="p-label">连续打卡</div><div class="p-unit">天</div></div><div class="p-stat"><div class="p-num">${userData.totalMinutes}</div><div class="p-label">学习时长</div><div class="p-unit">分钟</div></div><div class="p-stat"><div class="p-num">${totalPractice}</div><div class="p-label">练习题数</div><div class="p-unit">道</div></div><div class="p-stat"><div class="p-num">${overallAccuracy}%</div><div class="p-label">平均正确率</div><div class="p-unit"></div></div></div>
      <div class="knowledge-section"><h3><span class="icon">📈</span>学习趋势（最近7天）</h3><div class="content"><div class="trend-chart"><div class="trend-y-axis"><span>${maxM}分</span><span>${Math.round(maxM/2)}分</span><span>0分</span></div><div class="trend-bars">${trendData.map(d=>`<div class="trend-bar-item"><div class="trend-bar" style="height:${(d.m/maxM*100)}%"><span class="trend-value">${d.m}</span></div><div class="trend-day">${d.day}</div></div>`).join('')}</div></div><div class="trend-summary"><span>📊 已完成单元：<strong>${completedUnits}/${totalUnits || 0}</strong></span><span>📈 平均正确率：<strong style="color:${overallAccuracy>=75?'#27ae60':overallAccuracy>=60?'#f39c12':'#e74c3c'}">${overallAccuracy}%</strong></span></div></div></div>
      ${weakPoints.length > 0 ? `
      <div class="knowledge-section"><h3><span class="icon">🎯</span>薄弱知识点分析（${weakPoints.length}个）</h3><div class="content"><div class="weak-list">${weakPoints.slice(0,6).map(w=>`<div class="weak-item"><div class="weak-header"><span class="weak-subject ${w.s==='数学'?'math':'chinese'}">${w.s}</span><span class="weak-topic">${w.t}</span><span class="weak-level ${w.l==='需加强'?'danger':w.l==='一般'?'warning':'success'}">${w.l}</span></div><div class="weak-progress"><div class="weak-bar" style="width:${w.a}%;background:${w.a<70?'#e74c3c':w.a<80?'#f39c12':'#27ae60'}"></div></div><div class="weak-accuracy">正确率：${w.a}%</div></div>`).join('')}</div></div></div>
      ` : `
      <div class="knowledge-section"><h3><span class="icon">🎯</span>薄弱知识点分析</h3><div class="content"><div style="text-align:center;padding:20px;color:#27ae60">🎉 暂无明显薄弱知识点，继续保持！</div></div></div>
      `}
      <div class="knowledge-section ai-suggestion"><h3><span class="icon">🤖</span>AI智能学习建议</h3><div class="content"><div class="ai-avatar">🧠</div><div class="ai-content">
        <p><strong>📊 学习状态：</strong>孩子连续打卡${userData.streak}天，累计做题${totalPractice}道，平均正确率${overallAccuracy}%，${overallAccuracy >= 75 ? '学习状态良好，继续保持！' : overallAccuracy >= 60 ? '学习态度端正，但基础还需巩固。' : '学习积极性不错，但基础较弱，需要重点辅导。'}</p>
        ${topWeak ? `<p><strong>⚠️ 重点关注：</strong></p><ul><li>${topWeak.s}"${topWeak.t}"正确率仅${topWeak.a}%，建议每天做10道专项练习</li>${weakPoints[1] ? `<li>${weakPoints[1].s}"${weakPoints[1].t}"正确率${weakPoints[1].a}%，建议复习知识点并多做练习</li>` : ''}<li>错题本有${getTodayReviewQuestions().length}道题待复习，建议今天完成复习</li></ul>` : '<p><strong>✅ 学习状态良好，各知识点掌握均衡！</strong></p>'}
        <p><strong>📅 本周计划：</strong>周一至周五每天30分钟，重点突破薄弱点；周六完成一套单元考试检验效果；周日复习错题本。</p>
        <p><strong>💡 教育建议：</strong>孩子基础${overallAccuracy >= 75 ? '扎实' : '较弱'}，建议${overallAccuracy >= 75 ? '适当增加难度，挑战拔高题' : '先夯实基础，多做基础题建立信心'}。多鼓励少批评，每完成一个小目标就给予肯定，帮助建立学习信心。</p>
      </div></div></div>
      ${recP.length > 0 ? `
      <div class="knowledge-section"><h3><span class="icon">📝</span>最近练习与考试记录</h3><div class="content"><div class="practice-list">${recP.map(p=>`<div class="practice-item"><div class="practice-type ${p.ty==='考试'?'exam':'practice'}">${p.ty}</div><div class="practice-info"><div class="practice-title">${p.s} · ${p.u}</div><div class="practice-meta">${p.ti} · 答对${p.c}/${p.tq}题</div></div><div class="practice-score ${p.sc>=80?'good':p.sc>=60?'ok':'bad'}">${p.sc}<span>分</span></div></div>`).join('')}</div></div></div>
      ` : ''}
      <div class="parent-actions"><button class="btn btn-primary" onclick="alert('已发送鼓励消息给孩子：加油！你很棒！')">💪 发送鼓励</button><button class="btn btn-outline" onclick="alert('学习报告已生成，可导出PDF')">📄 导出报告</button></div>

        </div>

      </div>
      ${showReviewBtn ? `<button class="btn btn-primary" style="margin-top:10px;padding:8px;font-size:13px" onclick="startReviewSingle('${q.id}')">🔄 重做此题</button>` : ''}
    </div>
  `;
  
  // 筛选状态
  if(!STATE.wrongbookFilter) STATE.wrongbookFilter = {subject: 'all'};
  var filter = STATE.wrongbookFilter;
  
  // 按科目筛选
  var filterQuestions = function(arr){
    if(filter.subject === 'all') return arr;
    return arr.filter(function(q){ return q.subject === filter.subject; });
  };
  
  var filteredToday = filterQuestions(todayReview);
  var filteredPending = filterQuestions(pending);
  var filteredMastered = filterQuestions(mastered);
  
  return renderHeader('错题本', '智能复习 · 间隔重复 · 艾宾浩斯曲线', true)+
    `<div class="page">
      <div class="breadcrumb"><span onclick="navigate('grade')">首页</span><span class="sep">›</span><span>错题本</span></div>

      <div class="filter-bar">
        <select class="filter-select" onchange="STATE.wrongbookFilter.subject=this.value;render()">

          <option value="math" ${filter.subject==='math'?'selected':''}>数学</option>
          <option value="english" ${filter.subject==='english'?'selected':''}>英语</option>

        </div>
        <div style="background:#e3f2fd;padding:16px;border-radius:12px;text-align:center">
          <div style="font-size:28px;font-weight:700;color:#1976d2">${filteredPending.length}</div>
          <div style="font-size:12px;color:#666;margin-top:4px">待复习</div>
        </div>
        <div style="background:#c8e6c9;padding:16px;border-radius:12px;text-align:center">
          <div style="font-size:28px;font-weight:700;color:#388e3c">${filteredMastered.length}</div>
          <div style="font-size:12px;color:#666;margin-top:4px">已掌握</div>
        </div>
      </div>
      
      ${todayReview.length > 0 ? `
        <div style="background:linear-gradient(135deg,#fff3e0,#ffe0b2);padding:16px;border-radius:12px;margin-bottom:20px">

      ${todayReview.length > 0 ? `
        <div style="font-size:14px;font-weight:600;color:#333;margin:15px 0 10px">📅 今日待复习（${filteredToday.length}题）</div>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${filteredToday.map(q => renderQuestionCard(q, true)).join('')}

      ` : ''}
      
      <!-- 待复习 -->
      ${pending.length > 0 ? `
        <div style="font-size:14px;font-weight:600;color:#333;margin:20px 0 10px">⏳ 待复习（${filteredPending.length}题）</div>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${filteredPending.slice(0, 10).map(q => renderQuestionCard(q, false)).join('')}
        </div>
        ${pending.length > 10 ? `<div style="text-align:center;color:#999;font-size:12px;margin-top:10px">还有${pending.length - 10}道，到复习时间会自动显示</div>` : ''}
      ` : ''}
      
      <!-- 已掌握 -->
      ${mastered.length > 0 ? `
        <div style="font-size:14px;font-weight:600;color:#333;margin:20px 0 10px">✅ 已掌握（${filteredMastered.length}题）</div>
        <div style="display:flex;flex-direction:column;gap:12px">
          ${filteredMastered.slice(0, 5).map(q => renderQuestionCard(q, false)).join('')}
        </div>
        ${mastered.length > 5 ? `<div style="text-align:center;color:#999;font-size:12px;margin-top:10px">还有${mastered.length - 5}道已掌握的题目</div>` : ''}
      ` : ''}
      
      ${STATE.userData.wrongQuestions.length === 0 ? `

        </div>
      ` : ''}
    </div>`+renderTabBar('wrongbook');
}

// 开始复习模式
function startReviewMode() {
  const todayReview = getTodayReviewQuestions();
  if (todayReview.length === 0) {
    alert('今日没有需要复习的题目！');
    return;
  }
  
  const questions = todayReview.map(q => ({
    id: q.id,
    q: q.question,
    type: q.type,
    opts: q.opts,
    ans: q.ans,
    explain: q.explain,
    diff: q.diff,
    isReview: true,
    reviewId: q.id
  }));
  
  STATE.examState = {
    type: 'review',
    title: '错题复习',
    questions,
    current: 0,
    answers: new Array(questions.length).fill(null),
    correct: new Array(questions.length).fill(false),
    socratesActive: false,
    socratesSteps: [],
    socratesCurrent: 0,
    showHint: false,
    showExplain: false,
    submitted: false,
    timeUsed: 0,
    startTime: Date.now()
  };
  navigate('practice');
}

// 复习单题
function startReviewSingle(id) {
  const q = STATE.userData.wrongQuestions.find(w => w.id === id);
  if (!q) return;
  
  const questions = [{
    id: q.id,
    q: q.question,
    type: q.type,
    opts: q.opts,
    ans: q.ans,
    explain: q.explain,
    diff: q.diff,
    isReview: true,
    reviewId: q.id
  }];
  
  STATE.examState = {
    type: 'review',
    title: '错题复习',
    questions,
    current: 0,
    answers: new Array(questions.length).fill(null),
    correct: new Array(questions.length).fill(false),
    socratesActive: false,
    socratesSteps: [],
    socratesCurrent: 0,
    showHint: false,
    showExplain: false,
    submitted: false,
    timeUsed: 0,
    startTime: Date.now()
  };
  navigate('practice');
}

function checkAnswer(userAns){
  const es=STATE.examState;
  const q=es.questions[es.current];
  let isCorrect=false;
  if(q.type==='choice'){
    isCorrect=userAns===q.ans;
  }else{
    // 填空题/计算题/应用题：规范化答案后比较
    const normalize = (s) => {
      return String(s).trim()
        .replace(/，/g, ',')  // 中文逗号转英文
        .replace(/、/g, ' ')   // 中文顿号转空格
        .replace(/\s+/g, ' ')  // 多个空格转一个
        .replace(/,/g, ' ')    // 逗号转空格
        .replace(/。/g, '')     // 去掉句号
        .replace(/\.$/, '')     // 去掉结尾句号
        .toLowerCase();
    };
    const userNorm = normalize(userAns);
    const ansNorm = normalize(q.ans);
    // 直接比较
    if(userNorm === ansNorm){
      isCorrect = true;
    }else{
      // 支持多个答案用空格分隔的情况，逐个比较
      const userParts = userNorm.split(' ').filter(s=>s);
      const ansParts = ansNorm.split(' ').filter(s=>s);
      if(userParts.length === ansParts.length && userParts.length > 0){
        let allMatch = true;
        for(let i=0; i<userParts.length; i++){
          // 数字比较：允许微小误差
          const uNum = parseFloat(userParts[i]);
          const aNum = parseFloat(ansParts[i]);
          if(!isNaN(uNum) && !isNaN(aNum)){
            if(Math.abs(uNum - aNum) > 0.01){
              allMatch = false;
              break;
            }
          }else if(userParts[i] !== ansParts[i]){
            allMatch = false;
            break;
          }
        }
        isCorrect = allMatch;
      }
    }
  }
  es.correct[es.current]=isCorrect;
  if(!isCorrect){
    // 触发苏格拉底引导
    es.socratesActive=true;
    es.socratesSteps=generateSocrates(q);
    es.socratesCurrent=0;
    es.showHint=false;
  }else{
    es.socratesActive=false;
    es.showExplain=true;
  }
}

// 真正的开始练习函数
function startPracticeRealFunc(){
  const grade=STATE.selectedGrade;
  const term=STATE.selectedTerm;
  const subject=STATE.selectedSubject;
  const unitId=STATE.selectedUnit;
  
  // 自适应难度：根据历史正确率调整题目难度比例
  const p = getUnitProgress(grade, term, subject, unitId);
  const historyAccuracy = p.practiceTotal > 0 ? p.practiceCorrect / p.practiceTotal : 0.5;
  
  // 计算难度比例
  let basicRatio, mediumRatio, hardRatio;
  if (historyAccuracy >= 0.8) {
    basicRatio = 0.4; mediumRatio = 0.4; hardRatio = 0.2;
  } else if (historyAccuracy >= 0.6) {
    basicRatio = 0.5; mediumRatio = 0.35; hardRatio = 0.15;
  } else {
    basicRatio = 0.7; mediumRatio = 0.25; hardRatio = 0.05;
  }
  
  // 生成题目
  let questions=[];
  if(subject==='math'){
    questions=generateMathQuestions(grade,term,unitId,30);
  }else{
    questions=generateChineseQuestions(grade,term,unitId,30);
  }
  
  // 按自适应难度比例重新分配难度
  const basicCount = Math.round(30 * basicRatio);
  const mediumCount = Math.round(30 * mediumRatio);
  const hardCount = 30 - basicCount - mediumCount;
  
  // 打乱题目顺序后分配难度
  questions = questions.sort(() => Math.random() - 0.5);
  for (let i = 0; i < questions.length; i++) {
    if (i < basicCount) questions[i].diff = 'basic';
    else if (i < basicCount + mediumCount) questions[i].diff = 'medium';
    else questions[i].diff = 'hard';
  }
  
  // 分配分数 - 动态计算确保总分100分
  const typeWeights = {choice: 1, fill: 1.5, calc: 2, app: 3};
  let totalWeight = 0;
  questions.forEach(q => { totalWeight += typeWeights[q.type] || 1; });
  questions=questions.map(q=>{
    const weight = typeWeights[q.type] || 1;
    const score = Math.round((weight / totalWeight) * 100 * 10) / 10;
    return {...q,score};
  });
  // 调整最后一题分数确保总分正好100
  let sumScore = questions.reduce((sum,q)=>sum+q.score,0);
  if(questions.length > 0){
    questions[questions.length-1].score += Math.round((100 - sumScore) * 10) / 10;
  }
  
  STATE.examState={
    type: 'practice',
    title: '单元练习',
    questions,
    current:0,
    answers:new Array(questions.length).fill(null),
    correct:new Array(questions.length).fill(false),
    socratesActive:false,
    socratesSteps:[],
    socratesCurrent:0,
    showHint:false,
    showExplain:false,
    submitted:false,
    timeUsed:0,
    startTime: Date.now(),
    adaptiveInfo: {
      historyAccuracy: Math.round(historyAccuracy * 100),
      basicRatio: Math.round(basicRatio * 100),
      mediumRatio: Math.round(mediumRatio * 100),
      hardRatio: Math.round(hardRatio * 100)
    }
  };
  navigate('practice');
}

function startExam(type){
  const grade=STATE.selectedGrade;
  const term=STATE.selectedTerm;
  const subject=STATE.selectedSubject;
  const unitId=STATE.selectedUnit;
  const curriculum=CURRICULUM[grade][term][subject];
  
  // 根据考试类型确定题目范围
  let units = [];
  let examTitle = '';
  if(type==='unit'){
    units = [unitId];
    examTitle = curriculum.units.find(u=>u.id===unitId).name + ' 单元考试';
  }else if(type==='month'){
    const unitIndex = curriculum.units.findIndex(u=>u.id===unitId);
    const startIdx = Math.max(0, unitIndex - 2);
    units = curriculum.units.slice(startIdx, unitIndex+1).map(u=>u.id);
    examTitle = '月考试（阶段综合）';
  }else if(type==='mid'){
    const half = Math.ceil(curriculum.units.length / 2);
    units = curriculum.units.slice(0, half).map(u=>u.id);
    examTitle = '期中考试（半册综合）';
  }else{
    units = curriculum.units.map(u=>u.id);
    examTitle = '期末考试（全册综合）';
  }
  
  // 从各单元随机抽取题目，共30题
  let questions = [];
  const perUnit = Math.ceil(30 / units.length);
  units.forEach(uid=>{
    let unitQuestions = [];
    if(subject==='math'){
      unitQuestions = generateMathQuestions(grade, term, uid, perUnit);
    }else{
      unitQuestions = generateChineseQuestions(grade, term, uid, perUnit);
    }
    questions = questions.concat(unitQuestions);
  });
  // 打乱顺序，取前30题
  questions = questions.sort(()=>Math.random()-0.5).slice(0, 30);
  
  // 分配分数，总分100分
  questions = questions.map((q,i)=>{
    let score = 3;
    if(q.type==='calc') score = 5;
    if(q.type==='app') score = q.diff==='hard' ? 8 : 6;
    return {...q, score, examIndex: i+1};
  });
  
  STATE.examState = {
    type,
    title: examTitle,
    questions,
    current: 0,
    answers: new Array(questions.length).fill(null),
    correct: new Array(questions.length).fill(false),
    showAnswer: false,
    showExplain: false,
    submitted: false,
    timeUsed: 0,
    startTime: Date.now()
  };
  STATE.currentPage = 'exam';
  window.scrollTo(0,0);
  render();
}

// 提交考试
function submitExam(){
  const state = STATE.examState;
  state.submitted = true;
  state.timeUsed = Math.floor((Date.now() - state.startTime) / 1000);
  // 计算得分
  let totalScore = 0;
  let correctCount = 0;
  state.questions.forEach((q,i)=>{
    const userAnswer = state.answers[i];
    if(userAnswer !== null && userAnswer !== undefined && userAnswer !== ''){
      if(q.type==='choice'){
        state.correct[i] = parseInt(userAnswer) === q.ans;
      }else{
        state.correct[i] = String(userAnswer).trim() === String(q.ans).trim();
      }
    }
    if(state.correct[i]){
      totalScore += q.score;
      correctCount++;
    }
  });
  state.totalScore = totalScore;
  state.correctCount = correctCount;
  
  // 复习模式：更新错题复习状态
  if (state.type === 'review') {
    state.questions.forEach((q, i) => {
      if (q.isReview && q.reviewId) {
        updateWrongQuestionReview(q.reviewId, state.correct[i]);
      }
    });
  }
  
  // 收集错题（添加到智能复习系统）
  state.questions.forEach((q, i) => {
    if (!state.correct[i] && state.answers[i] !== null && state.answers[i] !== undefined && state.answers[i] !== '') {
      addWrongQuestion(q, STATE.selectedGrade, STATE.selectedTerm, STATE.selectedSubject, STATE.selectedUnit);
    }
  });
  
  // 更新单元进度（仅练习和单元考试更新当前单元进度）
  if (state.type === 'practice' || state.type === 'unit') {
    updatePracticeProgress(
      STATE.selectedGrade,
      STATE.selectedTerm,
      STATE.selectedSubject,
      STATE.selectedUnit,
      correctCount,
      state.questions.length
    );
  }
  
  // 记录考试历史
  STATE.userData.examHistory.push({
    type: state.type,
    title: state.title,
    score: totalScore,
    correct: correctCount,
    total: state.questions.length,
    time: state.timeUsed,
    date: new Date().toISOString()
  });
  
  STATE.currentPage = 'examResult';
  window.scrollTo(0,0);
  render();
}

    <div class="stats-grid">
      <div class="stat-item"><div class="stat-value">${state.correctCount}</div><div class="stat-label">答对题数</div></div>
      <div class="stat-item"><div class="stat-value">${state.questions.length-state.correctCount}</div><div class="stat-label">答错题数</div></div>
      <div class="stat-item"><div class="stat-value">${accuracy}%</div><div class="stat-label">正确率</div></div>
      <div class="stat-item"><div class="stat-value">${minutes}分${seconds}秒</div><div class="stat-label">用时</div></div>
    </div>
    <div class="answer-review">
      <h3>📝 答案与解析</h3>
      ${state.questions.map((q,i)=>`
        <div class="review-item ${state.correct[i]?'correct':'wrong'}">
          <div class="review-header">
            <span class="review-num">第${i+1}题</span>
            <span class="review-type">${q.type==='choice'?'选择题':q.type==='fill'?'填空题':q.type==='calc'?'计算题':'应用题'}</span>
            <span class="review-score">${q.score}分</span>
            <span class="review-result">${state.correct[i]?'✓ 正确':'✗ 错误'}</span>
          </div>
          <div class="review-question">${q.q}</div>
          <div class="review-answer">
            <div><strong>你的答案：</strong>${state.answers[i]||'未作答'}</div>
            <div><strong>正确答案：</strong>${q.type==='choice'?String.fromCharCode(65+q.ans)+'. '+q.opts[q.ans]:q.ans}</div>
          </div>
          <div class="review-explain"><strong>解析：</strong>${q.explain||'暂无解析'}</div>
        </div>
      `).join('')}
    </div>
    <div class="result-actions">
      <button class="btn btn-primary" onclick="navigate('study')">返回单元学习</button>
      <button class="btn btn-outline" onclick="startExam('${state.type}')">重新考试</button>
    </div>
  </div>`;
}

// 考试导航函数
function selectExamAnswer(index){
  STATE.examState.answers[STATE.examState.current] = index;
  render();
}
function nextExamQuestion(){
  if(STATE.examState.current < STATE.examState.questions.length - 1){
    STATE.examState.current++;
    window.scrollTo(0,0);
    render();
  }
}
function prevExamQuestion(){
  if(STATE.examState.current > 0){
    STATE.examState.current--;
    window.scrollTo(0,0);
    render();
  }
}
function goExamQuestion(index){
  STATE.examState.current = index;
  window.scrollTo(0,0);
  render();
}


// 保存上次学习位置
function saveLastStudy(){
  try{
    var study = {
      grade: STATE.selectedGrade,
      term: STATE.selectedTerm,
      subject: STATE.selectedSubject,
      unit: STATE.selectedUnit,
      time: Date.now()
    };
    localStorage.setItem('lastStudy', JSON.stringify(study));
    STATE.lastStudy = study;
  }catch(e){}
}

function navigate(page){
  STATE.currentPage=page;
  window.scrollTo(0,0);
  render();
}

function goBack(){
  const page=STATE.currentPage;
  if(page==='term')navigate('grade');
  else if(page==='subject')navigate('term');
  else if(page==='unit')navigate('subject');
  else if(page==='study')navigate('unit');
  else if(page==='practice'||page==='exam'){
    if(confirm('确定要退出考试吗？当前进度将丢失。'))navigate('study');
  }
  else if(page==='examResult')navigate('study');
  else if(page==='result')navigate('study');
  else if(page==='parent')navigate('grade');
  else navigate('grade');
}

// 初始化
loadUnitProgress();
loadWrongQuestions();
render();
</script>
</body>
</html>
